<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Unser Ideenglas</title>
<meta name="description" content="Eure gemeinsamen Ideen, Pläne und Erinnerungen.">
<meta name="theme-color" content="#F4F1FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1F1A36" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ideenglas">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Figtree:wght@500;600;700&display=swap">
<style>
/* Layout: "Euer Glühwürmchenglas". Phone-first column; lavender pages (Glas, Geplant, Erlebt) with white rounded
   rows and colored icon tiles, a night page for Einigen where the raccoon jar and fireflies glow, bottom bar with a raised plus. */
:root{
  --accent:#7B3F9E; --accent-ink:#FFFFFF;
  --bg:#F4F1FA; --surface:#FFFFFF; --track:#E8E2F2; --ink:#241F3B; --muted:#625C7C; --muted-2:#4C4666;
  --line:#E4DFF0; --dash:#D3C6E6; --timeline:#D8CCE8;
  --accent-soft:color-mix(in srgb,var(--accent) 14%,#FFFFFF); --accent-soft-ink:color-mix(in srgb,var(--accent) 78%,#000000);
  --heart:#D1347A; --heart-soft:#FCE4EF; --heart-off:#E9DDF0;
  --fly:#FFD866; --fly-hi:#FFE89A; --fly-deep:#E8B526; --fly-soft:#FFF0B8; --fly-ink:#241F3B;
  --cream:#FFFBEA; --cream-ink:#241F3B; --cream-muted:#625C7C;
  --deep:#1F1A36; --deep-2:#2A2447; --deep-ink:#F4F0FF; --deep-muted:#BDB4DC;
  --nav:#FFFFFF; --nav-active:var(--accent); --nav-pill:var(--accent-soft);
  --scrim:rgba(36,31,59,.45);
  --shadow:0 8px 18px -14px rgba(36,31,59,.45);
  --shadow-lg:0 18px 34px -18px rgba(36,31,59,.55);
  --t1b:#DDF2E3; --t1f:#2F7D4F; --t2b:#FFE4D6; --t2f:#B0501F; --t3b:#EFE5F7; --t3f:#7B3F9E; --t4b:#FFF0B8; --t4f:#8A6410;
  --t5b:#E2EAFA; --t5f:#2F5DB8; --t6b:#F3E8DA; --t6f:#85592B; --t7b:#FCE4EF; --t7f:#B32D6C; --tgb:#FFF0B8; --tgf:#8A6410;
  --f-display:"Baloo 2",ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;
  --f-body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1F1A36; --surface:#2A2447; --track:#332C54; --ink:#F4F0FF; --muted:#BDB4DC; --muted-2:#D3CBEE;
    --line:#3B3460; --dash:#4C4472; --timeline:#4C4472;
    --accent-soft:color-mix(in srgb,var(--accent) 30%,#2A2447); --accent-soft-ink:#EDE6FF;
    --heart:#F27BB2; --heart-soft:#45263F; --heart-off:#4C4472; --fly-soft:#3D3522;
    --deep:#2A2447; --deep-2:#332C54;
    --nav:#2A2447; --nav-active:#FFD866; --nav-pill:rgba(255,216,102,.16);
    --scrim:rgba(8,6,18,.62); --shadow:0 10px 22px -14px rgba(0,0,0,.7); --shadow-lg:0 18px 34px -16px rgba(0,0,0,.8);
    --t1b:#24392F; --t1f:#8FDCA8; --t2b:#3D2A24; --t2f:#FFB48A; --t3b:#352A4D; --t3f:#CDA8EC; --t4b:#3A3320; --t4f:#FFD866;
    --t5b:#22304D; --t5f:#9DB8F2; --t6b:#3A3026; --t6f:#E2B98A; --t7b:#42253A; --t7f:#F59AC4; --tgb:#3A3320; --tgf:#FFD866;
    color-scheme:dark;
  }
}
:root[data-theme="dark"], body.night{
  --bg:#1F1A36; --surface:#2A2447; --track:#332C54; --ink:#F4F0FF; --muted:#BDB4DC; --muted-2:#D3CBEE;
  --line:#3B3460; --dash:#4C4472; --timeline:#4C4472;
  --accent-soft:color-mix(in srgb,var(--accent) 30%,#2A2447); --accent-soft-ink:#EDE6FF;
  --heart:#F27BB2; --heart-soft:#45263F; --heart-off:#4C4472; --fly-soft:#3D3522;
  --deep:#2A2447; --deep-2:#332C54;
  --nav:#2A2447; --nav-active:#FFD866; --nav-pill:rgba(255,216,102,.16);
  --scrim:rgba(8,6,18,.62); --shadow:0 10px 22px -14px rgba(0,0,0,.7); --shadow-lg:0 18px 34px -16px rgba(0,0,0,.8);
  --t1b:#24392F; --t1f:#8FDCA8; --t2b:#3D2A24; --t2f:#FFB48A; --t3b:#352A4D; --t3f:#CDA8EC; --t4b:#3A3320; --t4f:#FFD866;
  --t5b:#22304D; --t5f:#9DB8F2; --t6b:#3A3026; --t6f:#E2B98A; --t7b:#42253A; --t7f:#F59AC4; --tgb:#3A3320; --tgf:#FFD866;
  color-scheme:dark;
}
/* lit cards (cream, glowing) keep their daylight colors on any page */
.lit{
  --ink:#241F3B; --muted:#625C7C; --line:#E4DFF0; --bg:#F4F1FA;
  --accent-soft:color-mix(in srgb,var(--accent) 14%,#FFFFFF); --accent-soft-ink:color-mix(in srgb,var(--accent) 78%,#000000);
  --heart:#D1347A; --heart-soft:#FCE4EF;
  --t1b:#DDF2E3; --t1f:#2F7D4F; --t2b:#FFE4D6; --t2f:#B0501F; --t3b:#EFE5F7; --t3f:#7B3F9E; --t4b:#FFF0B8; --t4f:#8A6410;
  --t5b:#E2EAFA; --t5f:#2F5DB8; --t6b:#F3E8DA; --t6f:#85592B; --t7b:#FCE4EF; --t7f:#B32D6C; --tgb:#FFF0B8; --tgf:#8A6410;
  background:var(--cream); color:var(--cream-ink); color-scheme:light;
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;font-weight:500;line-height:1.5;-webkit-font-smoothing:antialiased;transition:background-color .3s ease}
body.locked{overflow:hidden}
button{font:inherit;color:inherit}
.app{position:relative;z-index:1;max-width:560px;margin:0 auto;padding-inline:20px;padding-block:20px calc(130px + env(safe-area-inset-bottom,0px))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}
.center{text-align:center}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance}

/* fireflies, only at night */
.flies{position:fixed;inset:0;pointer-events:none;z-index:0;display:none}
body.night .flies{display:block}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .flies{display:block}}
:root[data-theme="dark"] .flies{display:block}
.flies i,.deep .fx{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--fly-hi);box-shadow:0 0 10px 4px rgba(255,216,102,.5);animation:blink 4.2s ease-in-out infinite alternate}
.flies i:nth-child(1){top:6%;right:9%}
.flies i:nth-child(2){top:17%;right:3%;width:5px;height:5px;animation-delay:-1.4s}
.flies i:nth-child(3){top:32%;left:2.5%;animation-delay:-2.6s}
.flies i:nth-child(4){top:56%;right:2.5%;width:5px;height:5px;animation-delay:-.8s}
.flies i:nth-child(5){top:78%;left:4%;animation-delay:-3.3s}
.flies i:nth-child(6){top:44%;right:46%;width:4px;height:4px;opacity:.6;animation-delay:-2s}
@keyframes blink{0%{opacity:.35;transform:translateY(0)}100%{opacity:1;transform:translateY(-6px)}}

/* page heads */
.page-h{margin:4px 0 0}
.page-h h1{margin:0;font-weight:800;font-size:27px;line-height:1.1}
.page-h p{margin:2px 0 0;font-size:14px;font-weight:600;color:var(--muted)}
.page-h.row-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{flex:none}
.brand h1{margin:0;font-weight:800;font-size:27px;line-height:1.05}
.hdr-r{display:flex;align-items:center;gap:8px;flex:none}
.people{display:flex;padding-left:10px}
.people .av{border:2px solid var(--bg);margin-left:-10px}
.iconbtn{width:44px;height:44px;border-radius:14px;border:2px solid var(--line);background:transparent;color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg{width:20px;height:20px}

/* avatars */
.av{display:inline-grid;place-items:center;border-radius:50%;overflow:hidden;flex:none;background:#E6E8EE;color:#241F3B;font-family:var(--f-display);font-weight:700;line-height:1}
.av svg{display:block;width:100%;height:100%}
.ic-heart{color:var(--heart);flex:none}

.banner{margin:0 0 12px;padding:10px 14px;border-radius:16px;background:var(--accent-soft);color:var(--accent-soft-ink);font-size:13.5px;font-weight:600}
.banner button{margin-left:6px}

/* news */
.news{margin-top:14px;padding:12px 14px;border-radius:20px;background:var(--surface);box-shadow:var(--shadow)}
.news-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.news-head b{font-family:var(--f-display);font-weight:700;font-size:15.5px;display:flex;align-items:center;gap:8px}
.news-items{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.news-item{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:8px 12px;background:var(--fly-soft);color:var(--ink);font-weight:700;font-size:13.5px;cursor:pointer;text-align:left;min-height:38px}
.news-item svg{width:15px;height:15px}
.glowdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--fly);box-shadow:0 0 0 3px rgba(255,216,102,.35),0 0 12px 4px rgba(255,196,60,.45);flex:none}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-20px;padding:2px 20px 6px}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible;margin-inline:0;padding-inline:0}
.chip,.rchip span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:700;cursor:pointer;line-height:1.2;flex:none;min-height:40px}
.chip[aria-pressed="true"],.rchip input:checked+span{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip .n{opacity:.7;font-variant-numeric:tabular-nums}
.chip.add{border-style:dashed;color:var(--muted);background:transparent}
.chip .x{display:inline-grid;place-items:center;width:18px;height:18px}
.chip .x svg{width:14px;height:14px}
.dot-new{width:7px;height:7px;border-radius:50%;background:var(--fly);box-shadow:0 0 8px 2px rgba(255,216,102,.6);flex:none}
.rchip{position:relative;display:inline-flex}
.rchip input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.rchip input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.jars{margin-top:14px}

/* stat tiles + segmented */
.stat3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.stat{position:relative;padding:10px 12px;border-radius:18px;background:var(--surface);box-shadow:var(--shadow)}
.stat b{display:block;font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;font-weight:600;color:var(--muted)}
.stat .glowdot{position:absolute;top:12px;right:12px}
.segrow{display:flex;gap:8px;margin-top:14px;align-items:stretch}
.seg{flex:1;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;padding:4px;border-radius:16px;background:var(--track)}
.seg button{min-height:44px;border:0;border-radius:12px;background:transparent;font-weight:600;font-size:14px;color:var(--muted-2);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;padding:0 6px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 2px 6px -2px rgba(36,31,59,.25)}
.seg button .n{font-size:12px;opacity:.75;font-variant-numeric:tabular-nums}
.seg .ic-heart{color:var(--heart)}
.segrow .iconbtn{height:auto;min-height:52px;width:52px;border-radius:16px}
.catchip{margin-top:10px}

/* section heads */
.sec{display:flex;align-items:center;gap:8px;margin:20px 0 10px;font-family:var(--f-display);font-weight:700;font-size:17px;line-height:1.2}
.sec .n{font-family:var(--f-body);font-size:13px;font-weight:700;color:var(--muted)}
.pill-fly{padding:1px 9px;border-radius:999px;background:var(--fly-soft);font-family:var(--f-body);font-size:12.5px;font-weight:700}

/* rows */
.rows{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:8px;min-height:70px;padding:10px 8px 10px 12px;border-radius:20px;background:var(--surface);box-shadow:var(--shadow)}
.row-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:0;border:0;background:none;text-align:left;cursor:pointer;color:inherit;min-height:50px}
.row-txt{display:flex;flex-direction:column;min-width:0;flex:1}
.row-kicker{font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);display:inline-flex;align-items:center;gap:5px}
.row-kicker svg{width:13px;height:13px;color:var(--fly-deep)}
.row-title{font-size:16px;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.row-meta{margin-top:2px;font-size:13px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.row-right{display:flex;align-items:center;gap:6px;flex:none;padding-right:6px}
.row-right .av{border:2px solid var(--surface)}
.row-right .av + .av{margin-left:-14px}
.newtag{display:inline-flex;align-items:center;gap:4px;margin-left:6px;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);vertical-align:2px}
.heartbtn{flex:none;width:44px;height:44px;border:2px solid var(--line);border-radius:50%;background:var(--surface);color:var(--muted);display:grid;place-items:center;cursor:pointer}
.heartbtn[aria-pressed="true"]{border-color:transparent;background:var(--heart-soft);color:var(--heart)}
.heartbtn svg{width:20px;height:20px}
.place-line{display:flex;align-items:flex-start;gap:4px;margin-top:2px;font-size:12.5px;font-weight:600;color:var(--muted);overflow-wrap:anywhere;line-height:1.3}
.place-line svg{flex:none;margin-top:1px}
.place{display:inline-flex;align-items:flex-start;gap:6px;color:inherit;font-weight:700;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px;overflow-wrap:anywhere;line-height:1.35}
.place svg{flex:none;margin-top:1px}

/* icon tiles */
.tile{flex:none;display:grid;place-items:center;border-radius:14px;background:var(--tb);color:var(--tf)}
.tile svg{width:22px;height:22px}
.tile.l{border-radius:16px}
.tile.l svg{width:26px;height:26px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;border-radius:16px;padding:10px 18px;font-weight:700;font-size:15.5px;border:2px solid transparent;cursor:pointer;text-decoration:none;line-height:1.2;background:transparent;color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.soft{background:var(--accent-soft);color:var(--accent-soft-ink)}
.btn.ghost{border-color:var(--line)}
.btn.fly{background:var(--fly);color:var(--fly-ink);font-family:var(--f-display);font-size:18px;box-shadow:0 0 28px -4px rgba(255,216,102,.55)}
.btn.danger{background:var(--heart);color:#FFFFFF}
.btn.small{min-height:40px;padding:7px 13px;font-size:14px;border-radius:13px}
.btn svg{width:18px;height:18px;flex:none}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.link-btn{background:none;border:0;padding:8px 0;color:var(--muted);font-weight:700;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.link-btn.danger{color:var(--heart)}
.more{display:flex;justify-content:center;margin-top:22px}
:is(.btn,.chip,.tab,.iconbtn,.link-btn,.row-main,.heartbtn,.seg button,.news-item,.round,.card,.memo-main,.ph-btn,.addbtn,.place,.photo-grid button,.lb-btn,.freshnote,.pinned-main):focus-visible{outline:3px solid var(--accent);outline-offset:3px}
body.night :is(.btn,.chip,.tab,.iconbtn,.link-btn,.row-main,.heartbtn,.seg button,.round,.card,.addbtn,.place,.freshnote):focus-visible{outline-color:var(--fly)}

.freshnote{display:flex;align-items:center;gap:10px;width:100%;margin-top:14px;padding:12px 14px;border:0;border-radius:18px;background:var(--surface);box-shadow:var(--shadow);color:var(--ink);text-align:left;font-weight:600;cursor:pointer;text-decoration:none}
.freshnote b{font-family:var(--f-display);font-weight:700}
.freshnote .go{margin-left:auto;font-weight:700;color:var(--accent-soft-ink);white-space:nowrap}

/* bottom bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;padding-bottom:env(safe-area-inset-bottom,0px);pointer-events:none}
.tabs-in{pointer-events:auto;max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:end;padding:8px 8px 18px;border-radius:26px 26px 0 0;background:var(--nav);box-shadow:0 -10px 24px -18px rgba(36,31,59,.5)}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:54px;color:var(--muted);text-decoration:none;font-weight:600;font-size:12px}
.tab .tw{display:grid;place-items:center;width:56px;height:30px;border-radius:999px}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--nav-active);font-weight:700}
.tab[aria-current="page"] .tw{background:var(--nav-pill)}
.tab .tdot{position:absolute;top:2px;left:calc(50% + 12px);width:9px;height:9px;border-radius:50%;background:var(--fly);box-shadow:0 0 8px 2px rgba(255,216,102,.7);border:2px solid var(--nav)}
.tab-add{display:flex;justify-content:center}
.addbtn{width:60px;height:60px;margin-top:-30px;border:4px solid var(--bg);border-radius:22px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;cursor:pointer;box-shadow:0 12px 20px -10px rgba(36,31,59,.7)}
.addbtn svg{width:26px;height:26px}
.addbtn[hidden]{display:grid!important;visibility:hidden}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.backdrop{position:absolute;inset:0;background:var(--scrim);border:0;padding:0;cursor:default}
.sheet{position:relative;width:100%;max-width:560px;max-height:90vh;max-height:90dvh;overflow-y:auto;overscroll-behavior:contain;background:var(--surface);color:var(--ink);border-radius:28px 28px 0 0;padding:0 20px calc(24px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow-lg);animation:sheetUp .24s ease-out}
@keyframes sheetUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@media (min-width:640px){.sheet-wrap{align-items:center;padding:24px}.sheet{border-radius:28px;padding-bottom:24px}}
.sheet-bar{position:sticky;top:0;display:flex;justify-content:center;align-items:center;height:40px;background:var(--surface);z-index:3;margin-inline:-20px}
.grip{width:40px;height:5px;border-radius:3px;background:var(--line)}
.sheet-x{position:absolute;right:10px;top:2px;width:36px;height:36px;border-radius:50%;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer}
.sheet-x svg{width:20px;height:20px}
.sheet-h{font-weight:800;font-size:23px;margin:2px 0 4px;line-height:1.15}
.sheet-h:focus{outline:none}
.sheet-sub{color:var(--muted);margin:0 0 14px;font-weight:600;text-wrap:pretty}
.sheet-name{font-family:var(--f-display);font-weight:700;font-size:19px;line-height:1.2;margin:0}
.sheet-card{padding:14px 16px 16px;border-radius:22px;background:var(--bg);margin:4px 0 14px;display:flex;flex-direction:column;gap:8px}
.sheet-card.lit{box-shadow:0 0 0 1px rgba(255,216,102,.55),0 0 40px -6px rgba(255,216,102,.45)}
.sc-top{display:flex;align-items:center;gap:12px}
.sc-kicker{display:block;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.sc-title{margin:0;font-weight:800;font-size:22px;line-height:1.12;overflow-wrap:anywhere}
.sc-title:focus{outline:none}
.sc-meta{font-size:13.5px;font-weight:600;color:var(--muted)}
.sheet-note{margin:0;font-size:14.5px;line-height:1.45;white-space:pre-line;overflow-wrap:anywhere}
.gift-hero{align-items:center;text-align:center;padding:22px 16px 18px}
.gift-hero .tile{width:64px;height:64px;border-radius:20px}
.gift-hero .tile svg{width:34px;height:34px}
.hintline{font-size:14.5px;font-weight:700;margin:0}
.byline{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 12px}
.status{margin:0 0 14px;padding:12px 14px;border-radius:16px;background:var(--bg);display:flex;flex-direction:column;gap:6px}
.status b{font-family:var(--f-display);font-weight:700;font-size:16px}
.private{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--accent-soft-ink);margin:0 0 12px}
.private svg{width:15px;height:15px}
.vote-row{display:flex;flex-direction:column;gap:10px;padding:12px 0;border-top:2px solid var(--line);border-bottom:2px solid var(--line);margin-bottom:16px}
.vote-who{display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.actions .btn.primary{flex:1 1 100%}
.actions .btn.soft,.actions .btn.ghost{flex:1 1 auto}
.del-area{margin-top:14px}
.confirm{padding:12px 14px;border-radius:16px;background:var(--heart-soft)}
.confirm p{margin:0 0 10px;font-weight:700}
.row-flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* forms */
.form{display:flex;flex-direction:column;gap:16px}
.field{display:grid;gap:7px;border:0;margin:0;padding:0;min-width:0}
.lbl{font-size:13px;font-weight:700;color:var(--muted);padding:0}
.opt{font-weight:600;opacity:.8}
.help{font-size:12.5px;font-weight:600;color:var(--muted);margin:0}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=time],textarea{width:100%;font:inherit;font-size:16px;font-weight:600;padding:11px 13px;border:2px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);min-width:0}
input[type=text]:focus-visible,input[type=email]:focus-visible,input[type=password]:focus-visible,input[type=date]:focus-visible,input[type=time]:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:1px;border-color:transparent}
textarea{resize:vertical;min-height:72px}
.err{color:var(--heart);font-size:13px;margin:0;font-weight:700}
.form-actions{display:flex;gap:10px;margin-top:4px}
.form-actions .btn.primary{flex:1}
.time-row{display:grid;grid-template-columns:minmax(0,1fr) 128px;gap:10px;align-items:start}
.hearts-input{display:flex;gap:6px}
.hrt{cursor:pointer;color:var(--heart-off);position:relative;display:inline-flex}
.hrt input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.hrt svg{width:38px;height:38px;display:block}
.hrt.on{color:var(--heart)}
.hrt input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px}
.toggle{display:flex;align-items:center;gap:10px;font-weight:700;cursor:pointer;min-height:44px}
.toggle input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.daylist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.daylist li{display:flex;align-items:center;gap:10px;padding:8px 10px;border:2px solid var(--line);border-radius:14px}
.daylist .grow{flex:1;min-width:0}
.daylist small{display:block;color:var(--muted);font-size:12.5px;font-weight:600}
.dayadd{display:grid;grid-template-columns:1fr;gap:8px;padding:12px;border:2px dashed var(--dash);border-radius:16px}
@media (min-width:480px){.dayadd{grid-template-columns:1fr 160px}}
.dayadd .err{grid-column:1/-1}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatch{display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;cursor:pointer;font-size:12px;font-weight:700;color:var(--muted);padding:0}
.swatch i{display:block;width:48px;height:40px;border-radius:12px;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.swatch[aria-pressed="true"] i{outline:3px solid var(--ink);outline-offset:2px}

/* photos */
.ph-edit,.ph-row{display:flex;flex-wrap:wrap;gap:8px}
.ph-item{position:relative;width:64px;height:64px;border-radius:14px;overflow:hidden;background:var(--track)}
.ph-item img{width:100%;height:100%;object-fit:cover;display:block}
.ph-item button{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;border:0;background:var(--scrim);color:#FFFFFF;display:grid;place-items:center;cursor:pointer;padding:0}
.ph-item button svg{width:13px;height:13px}
.ph-add,.ph-btn{width:64px;height:64px;border:2px dashed var(--dash);border-radius:14px;display:grid;place-items:center;color:var(--muted);cursor:pointer;background:transparent;padding:0}
.ph-add svg,.ph-btn svg{width:22px;height:22px}
.ph-add:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.ph-thumb{width:64px;height:64px;border-radius:14px;overflow:hidden;border:0;padding:0;background:var(--track);cursor:zoom-in}
.ph-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.photo-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:0 0 14px}
.photo-grid button{padding:0;border:0;background:var(--track);border-radius:16px;overflow:hidden;aspect-ratio:1;cursor:zoom-in;max-width:100%}
.photo-grid img{width:100%;height:100%;object-fit:cover;display:block}
img.broken{visibility:hidden}
.lightbox{position:fixed;inset:0;z-index:70;background:rgba(10,8,22,.94);display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 56px) 12px calc(env(safe-area-inset-bottom,0px) + 56px)}
.lightbox img{max-width:100%;max-height:100%;border-radius:10px;object-fit:contain}
.lb-btn{position:absolute;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#FFFFFF;display:grid;place-items:center;cursor:pointer}
.lb-btn svg{width:22px;height:22px}
.lb-close{top:calc(env(safe-area-inset-top,0px) + 10px);right:12px}
.lb-prev{left:12px;top:50%;margin-top:-22px}
.lb-next{right:12px;top:50%;margin-top:-22px}
.lb-count{position:absolute;top:calc(env(safe-area-inset-top,0px) + 20px);left:16px;color:#FFFFFF;font-size:13px;font-weight:700;opacity:.8}

/* Einigen (night) */
.stack{position:relative;height:350px;max-width:350px;margin:18px auto 0}
.card{position:absolute;inset:0;border-radius:26px;padding:20px 20px 18px;display:flex;flex-direction:column;gap:8px;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab;transition:transform .25s ease,opacity .25s ease;box-shadow:0 0 0 1px rgba(255,216,102,.55),0 0 40px -6px rgba(255,216,102,.45)}
.card:active{cursor:grabbing}
.card.d1{transform:translateY(12px) scale(.95) rotate(-2.5deg);pointer-events:none;box-shadow:0 0 0 1px rgba(255,216,102,.3)}
.card.d2{transform:translateY(22px) scale(.9) rotate(2.5deg);pointer-events:none;opacity:.7;box-shadow:none}
.card.later-out{transform:translateY(70px) scale(.9);opacity:0}
.card-top{display:flex;align-items:center;gap:12px}
.card-cat{font-size:12.5px;font-weight:700;color:var(--muted)}
.card-title{margin:4px 0 0;font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1.08;overflow-wrap:anywhere;text-wrap:balance}
.card-meta{font-size:13.5px;font-weight:600;color:var(--muted)}
.card-note{font-size:14.5px;line-height:1.45;margin:0;white-space:pre-line;overflow:hidden;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical}
.card-by{margin-top:auto;font-size:12.5px;font-weight:600;color:var(--muted)}
.stamp{position:absolute;top:18px;padding:3px 10px;border:3px solid currentColor;border-radius:10px;font-family:var(--f-display);font-weight:800;font-size:16px;text-transform:uppercase;letter-spacing:.04em;opacity:0;transition:opacity .12s;background:var(--cream)}
.stamp.yes{right:16px;color:#D1347A;transform:rotate(10deg)}
.stamp.no{left:16px;color:#625C7C;transform:rotate(-10deg)}
.card[data-dir="yes"] .stamp.yes,.card[data-dir="no"] .stamp.no{opacity:1}
.swipe-btns{display:flex;justify-content:center;align-items:center;gap:16px;margin-top:30px}
.rb{display:flex;flex-direction:column;align-items:center;gap:6px}
.rb > span{font-size:12px;font-weight:700;color:var(--muted)}
.round{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;border:2px solid rgba(255,255,255,.18);background:var(--surface);cursor:pointer;color:var(--ink)}
.round svg{width:28px;height:28px}
.round.yes{background:var(--heart);border-color:transparent;color:#FFFFFF;box-shadow:0 10px 24px -10px rgba(209,52,122,.8)}
.round.undo,.round.later{width:48px;height:48px}
.round.undo svg,.round.later svg{width:20px;height:20px}
.round.later{color:var(--fly)}
.round:disabled{opacity:.35;cursor:not-allowed}
.hint-keys{font-size:12.5px;font-weight:600;margin:10px 0 0}
.allswiped{margin:18px 0 0;text-align:center;padding:20px 18px;border:2px dashed var(--dash);border-radius:24px}
.allswiped p{margin:0 0 12px;font-weight:600;color:var(--muted)}
.allswiped .row-flex{justify-content:center}
.matchnote{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-radius:22px;padding:12px 14px;margin:14px 0 0}
.matchnote .mn-txt{flex:1;min-width:160px;font-weight:600}
.matchnote b{font-family:var(--f-display);font-weight:800}
.matchnote .mn-title{display:block;font-family:var(--f-display);font-weight:700;font-size:18px;line-height:1.2}
.matchnote .sheet-x{position:static}
.drawbox{position:relative;margin-top:26px;padding:14px 16px;border-radius:28px;background:var(--surface);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}
.drawbox h2{margin:0 0 8px;font-weight:700;font-size:17px}
.dchips{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dchip{padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.1);color:#EDE6FF;font-size:13px;font-weight:700}
.dchips .iconbtn{margin-left:auto;border-color:rgba(255,255,255,.18)}
.jarfig{display:flex;justify-content:center;margin-top:4px;transform-origin:50% 90%}
.jarfig svg{width:196px;height:auto;max-width:100%}
.shake{animation:shake .55s ease-in-out}
@keyframes shake{0%,100%{transform:rotate(0)}15%{transform:rotate(-6deg)}35%{transform:rotate(5deg)}55%{transform:rotate(-4deg)}75%{transform:rotate(3deg)}}
.drawbox .btn.fly{width:100%;margin-top:6px;min-height:54px;border-radius:18px}
.drawbox .note{margin:8px 0 0;text-align:center;font-size:13px;font-weight:600;color:var(--muted)}
.lit-card{position:relative;margin-top:14px;padding:14px 16px 16px;border-radius:24px;box-shadow:0 0 0 1px rgba(255,216,102,.55),0 0 40px -6px rgba(255,216,102,.45)}
.lit-card.pop{animation:pop .55s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{transform:translateY(40px) scale(.85);opacity:0}to{transform:none;opacity:1}}
.litpill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px 2px 8px;border-radius:999px;background:var(--fly);font-size:12.5px;font-weight:700;color:var(--fly-ink)}
.litpill i{width:7px;height:7px;border-radius:50%;background:#FFFFFF;box-shadow:0 0 6px 2px rgba(255,255,255,.9)}
.lit-head{display:flex;align-items:center;gap:12px;margin-top:10px}
.lit-title{margin:0;font-weight:800;font-size:22px;line-height:1.1;overflow-wrap:anywhere}
.lit-meta{margin:2px 0 0;font-size:13px;font-weight:600;color:var(--muted)}
.lit-note{margin:10px 0 0;font-size:14.5px;line-height:1.45;white-space:pre-line}
.lit-actions{display:flex;gap:10px;margin-top:14px}
.lit-actions .btn{flex:1}
.lit-card .place{margin-top:8px}
.lit-card .link-btn{display:block;margin:8px auto 0;color:var(--muted)}
.einseg{margin:26px 0 12px}

/* Geplant */
.plans{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.plan{display:flex;align-items:center;gap:8px;padding:10px 10px 10px 12px;border-radius:20px;background:var(--surface);box-shadow:var(--shadow)}
.dtile{flex:none;width:54px;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:16px;background:var(--accent-soft);color:var(--accent-soft-ink);line-height:1.05;padding:4px 0}
.dtile.gift{background:var(--tgb);color:var(--tgf)}
.dt-wd,.dt-m{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.dt-wd svg{width:15px;height:15px;display:block}
.dt-d{font-family:var(--f-display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
.plan.past .row-meta{color:var(--heart);font-weight:700}

/* Album */
.deep{position:relative;overflow:hidden;margin-top:14px;padding:14px 16px 15px;border-radius:22px;background:var(--deep);color:var(--deep-ink)}
.deep .fx:nth-of-type(1){top:18px;right:34px}
.deep .fx:nth-of-type(2){top:54px;right:70px;width:5px;height:5px;animation-delay:-1.2s}
.deep .fx:nth-of-type(3){top:72px;right:22px;animation-delay:-2.4s}
.deep .fx:nth-of-type(4){top:30px;right:112px;width:4px;height:4px;animation-delay:-3.1s}
.eyebrow-fly{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--fly)}
.eyebrow-fly svg{width:14px;height:14px}
.days-num{margin-top:4px;font-family:var(--f-display);font-weight:800;font-size:46px;line-height:.95;font-variant-numeric:tabular-nums}
.days-lbl{font-family:var(--f-display);font-weight:700;font-size:18px}
.days-sub{margin:4px 0 0;font-size:13.5px;font-weight:600;color:var(--deep-muted)}
.days-empty{margin:4px 0 0;font-weight:600;color:var(--deep-muted)}
.next{position:relative;list-style:none;margin:6px 0 0;padding:0}
.next li{display:flex;align-items:baseline;gap:12px;padding:8px 0;border-top:1px solid rgba(255,255,255,.12)}
.next .nd{width:92px;flex:none;font-size:13px;font-weight:600;color:var(--deep-muted);font-variant-numeric:tabular-nums}
.next .nl{flex:1;min-width:0;font-weight:700}
.next .nr{font-size:13px;font-weight:600;color:var(--deep-muted);white-space:nowrap}
.next li.today .nl,.next li.today .nr{color:var(--fly)}
.deep .btn.small{background:rgba(255,255,255,.1);color:var(--deep-ink)}
.days-head{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px}
.dgrid{position:relative;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.dg{min-width:0;padding:10px 12px 11px;border-radius:16px;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.09)}
.dg.wide{grid-column:1/-1}
.dg.today{box-shadow:inset 0 0 0 1.5px rgba(255,216,102,.75),0 0 22px -6px rgba(255,216,102,.6)}
.dg-k{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--deep-muted)}
.dg-k span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dg-k svg{width:14px;height:14px;flex:none;color:var(--fly)}
.dg-n{display:block;margin-top:4px;font-family:var(--f-display);font-weight:800;font-size:32px;line-height:1;font-variant-numeric:tabular-nums}
.dg.today .dg-n{color:var(--fly)}
.dg-u{display:block;margin-top:2px;font-size:13px;font-weight:700}
.dg-s{display:block;margin-top:5px;font-size:12px;font-weight:600;line-height:1.35;color:var(--deep-muted)}
.next-h{position:relative;margin:14px 0 0;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--deep-muted)}
.pinned-main{display:block;width:100%;padding:0;border:0;background:none;color:inherit;text-align:left;cursor:pointer}
.pinned-main h2{margin:4px 0 0;font-weight:700;font-size:20px;line-height:1.15}
.pinned-main p{margin:2px 0 0;font-size:13.5px;font-weight:600;color:var(--deep-muted)}
.month{display:flex;align-items:baseline;gap:8px;margin:20px 0 10px;font-weight:700;font-size:17px;line-height:1.2}
.month .n{font-family:var(--f-body);font-size:13px;font-weight:700;color:var(--muted)}
.tl{position:relative;display:flex;flex-direction:column;gap:12px;padding-left:30px}
.tl::before{content:"";position:absolute;left:10px;top:20px;bottom:0;border-left:2px dashed var(--timeline)}
.memo{position:relative;padding:12px 14px 14px;border-radius:22px;background:var(--surface);box-shadow:var(--shadow)}
.memo::before{content:"";position:absolute;left:-25px;top:17px;width:12px;height:12px;border-radius:50%;border:1.5px solid var(--fly-deep);background:var(--fly);box-shadow:0 0 0 4px rgba(255,216,102,.3),0 0 14px 4px rgba(255,196,60,.5)}
.memo-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.memo-date{font-size:12.5px;font-weight:700;color:var(--muted)}
.hearts{display:flex;align-items:center;gap:2px;color:var(--heart)}
.hearts svg{width:14px;height:14px}
.hearts .off{color:var(--heart-off)}
.hearts .hn{margin-left:4px;font-size:12.5px;font-weight:700;color:var(--muted)}
.memo-main{display:block;width:100%;padding:0;border:0;background:none;color:inherit;text-align:left;cursor:pointer}
.memo-kicker{display:flex;align-items:center;gap:5px;margin-top:4px;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.memo-kicker svg{width:13px;height:13px;color:var(--fly-deep)}
.memo-title{display:block;margin:2px 0 0;font-family:var(--f-display);font-weight:700;font-size:19px;line-height:1.15;overflow-wrap:anywhere}
.memo-quote{display:block;margin:4px 0 0;font-size:14px;line-height:1.45;white-space:pre-line;overflow-wrap:anywhere}
.memo-quote b{color:var(--muted)}
.memo .ph-row{margin-top:10px}

/* empty states, suggestions */
.empty{text-align:center;padding-top:6px}
.empty-fig{display:flex;justify-content:center;width:fit-content;max-width:100%;margin:0 auto;padding:10px 18px 4px;border-radius:28px;background:var(--deep)}
.empty-fig svg{width:150px;height:auto}
.empty-h{margin:8px 0 4px;font-weight:800;font-size:24px;line-height:1.15}
.empty-p{color:var(--muted);font-weight:600;max-width:42ch;margin:0 auto 16px;text-wrap:pretty}
.empty .row-flex{justify-content:center}
.empty .sec{justify-content:center}
.sugg-list{display:flex;flex-direction:column;gap:10px;text-align:left;margin-top:12px}
.sugg{display:flex;align-items:center;gap:12px;padding:10px 10px 10px 12px;border-radius:20px;background:var(--surface);box-shadow:var(--shadow);min-width:0}
.sheet .sugg{background:var(--bg);box-shadow:none}
.sugg .row-txt{flex:1}
.sugg-done{font-size:12.5px;font-weight:700;display:inline-flex;align-items:center;gap:4px;color:var(--muted);flex:none;padding-right:6px}
.sugg-done svg{width:15px;height:15px}

/* settings */
.set-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.set-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:var(--bg)}
.set-item .grow{flex:1;min-width:0}
.set-item b{font-family:var(--f-display);font-weight:700}
.set-item small{display:block;color:var(--muted);font-size:12.5px;font-weight:600}
.set-block{display:flex;flex-direction:column;gap:12px}
.set-block p{margin:0}
.sheet .sec{margin-top:22px}

/* date proposals */
.sec + .plans{margin-top:0}
.dtile.ask{background:var(--fly-soft);color:var(--ink);gap:3px}
.dtile.ask svg{width:20px;height:20px;color:var(--fly-deep)}
.dtile.ask .dt-m{font-weight:800}
.plan.ask{box-shadow:var(--shadow),0 0 0 1.5px rgba(232,181,38,.55)}
.status.prop{gap:8px}
.optlist{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.optbtn{display:flex;align-items:center;gap:12px;width:100%;padding:8px 12px 8px 8px;border-radius:18px;border:2px solid transparent;background:var(--surface);color:var(--ink);text-align:left;font:inherit;cursor:pointer;min-height:60px}
.optbtn .dtile{width:48px;min-height:52px}
.opt-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.opt-txt b{font-family:var(--f-display);font-weight:700;font-size:16px;line-height:1.2}
.opt-txt span{font-size:13px;font-weight:600;color:var(--muted)}
.opt-check{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--track);color:transparent}
.opt-check svg{width:16px;height:16px}
.optbtn[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}
.optbtn[aria-checked="true"] .opt-check{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.optbtn:disabled{opacity:.55;cursor:default}
.optbtn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.optbtn.static{cursor:default}
.more-opt{align-self:flex-start}

/* special experiences */
.special-row{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border-radius:16px;background:var(--fly-soft);cursor:pointer}
.special-row input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--accent);flex:none}
.sp-txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.sp-txt b{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-display);font-weight:700;font-size:16px}
.sp-txt b svg{width:16px;height:16px;color:var(--fly-deep)}
.sp-txt span{font-size:13px;font-weight:600;color:var(--muted-2);line-height:1.4}
.time-row.dates2{grid-template-columns:repeat(2,minmax(0,1fr))}

/* Weißt du noch? */
.remember .rem-in{position:relative;display:flex;align-items:center;gap:14px}
.rem-ph{flex:none;width:78px;height:78px;padding:0;border:0;border-radius:18px;overflow:hidden;background:var(--deep-2);cursor:pointer;box-shadow:0 0 0 2px rgba(255,216,102,.5),0 0 22px -4px rgba(255,216,102,.6)}
.rem-ph img{width:100%;height:100%;object-fit:cover;display:block}
.rem-txt{flex:1;min-width:0;padding-right:34px}
.rem-txt .pinned-main h2{font-size:19px;overflow-wrap:anywhere}
.rem-x{position:absolute;top:-6px;right:-8px;color:var(--deep-muted);background:transparent}
.rem-ph:focus-visible,.remember .pinned-main:focus-visible{outline:3px solid var(--fly);outline-offset:3px}

/* album cover for special experiences */
.memo.special::before{width:14px;height:14px;left:-26px}
.memo-cover{position:relative;display:grid;gap:4px;width:100%;margin:10px 0 2px;padding:0;border:0;border-radius:16px;overflow:hidden;background:var(--track);cursor:pointer;aspect-ratio:16/10}
.memo-cover.n2{grid-template-columns:2fr 1fr}
.memo-cover.n3{grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr}
.memo-cover.n3 img:first-child{grid-row:span 2}
.memo-cover img{width:100%;height:100%;object-fit:cover;display:block;min-height:0}
.cover-pill{position:absolute;left:10px;bottom:10px;display:inline-flex;align-items:center;gap:5px;padding:5px 11px 5px 9px;border-radius:999px;background:rgba(31,26,54,.82);color:var(--fly);font-size:12.5px;font-weight:700;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.cover-pill svg{width:14px;height:14px}
.memo-cover:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

.recap{position:fixed;inset:0;z-index:65;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:radial-gradient(120% 60% at 50% 0%,#2E2754 0%,#1F1A36 55%,#16122A 100%);color:#F4F0FF;--deep-muted:#BDB4DC}
.recap .fx{position:fixed;width:6px;height:6px;border-radius:50%;background:var(--fly-hi);box-shadow:0 0 10px 4px rgba(255,216,102,.5);animation:blink 4.2s ease-in-out infinite alternate;pointer-events:none}
.recap .fx:nth-of-type(1){top:12%;left:12%}
.recap .fx:nth-of-type(2){top:22%;right:10%;animation-delay:-1.4s}
.recap .fx:nth-of-type(3){top:58%;left:6%;width:4px;height:4px;animation-delay:-2.2s}
.recap .fx:nth-of-type(4){top:76%;right:7%;animation-delay:-3s}
.recap .fx:nth-of-type(5){top:40%;right:30%;width:4px;height:4px;animation-delay:-.6s}
.recap-in{position:relative;max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 28px)}
.recap-top{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.recap-x{position:static}
.recap-h{margin:6px 0 0;font-family:var(--f-display);font-weight:800;font-size:clamp(28px,8vw,38px);line-height:1.05;overflow-wrap:anywhere;text-wrap:balance}
.recap-when{margin:6px 0 0;font-weight:700;color:var(--deep-muted)}
.recap-place{margin:6px 0 0}
.recap-place .place{color:#F4F0FF}
.recap-facts{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0}
.fact{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.09);font-size:13.5px;font-weight:700}
.fact svg{width:15px;height:15px;color:var(--fly)}
.fact .hearts svg{color:var(--heart)}
.fact .hearts .off svg,.fact .hearts .off{color:rgba(255,255,255,.25)}
.fact .hearts .hn{color:var(--deep-muted)}
.collage{--cw:min(calc(100vw - 32px),528px);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:calc((var(--cw) - 12px) / 3);grid-auto-flow:dense;gap:6px;margin:18px 0 0}
.cl{padding:0;border:0;border-radius:12px;overflow:hidden;background:rgba(255,255,255,.07);cursor:zoom-in;min-width:0;min-height:0}
.cl img{width:100%;height:100%;object-fit:cover;display:block}
.cl.big{grid-column:span 2;grid-row:span 2;border-radius:16px}
.cl.bigr{grid-column:2 / span 2;grid-row:span 2;border-radius:16px}
.cl.tall{grid-row:span 2}
.cl.wide{grid-column:span 2}
.cl.full{grid-column:span 3}
.cl.solo{grid-column:span 3;grid-row:span 2;border-radius:18px}
.cl:focus-visible{outline:3px solid var(--fly);outline-offset:2px}
.collage .cl:first-child{box-shadow:0 0 0 2px rgba(255,216,102,.45),0 0 30px -6px rgba(255,216,102,.55)}
.recap-empty{margin:18px 0 0;padding:18px;border-radius:18px;border:2px dashed rgba(255,255,255,.2);font-weight:600;color:var(--deep-muted);text-align:center}
.recap-quote{margin:18px 0 0;padding:16px 18px;border-radius:20px;background:rgba(255,255,255,.07)}
.recap-quote blockquote{margin:0;font-family:var(--f-display);font-weight:600;font-size:19px;line-height:1.35;white-space:pre-line;overflow-wrap:anywhere}
.recap-quote figcaption{margin-top:6px;font-size:13px;font-weight:700;color:var(--fly)}
.recap-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.recap-actions .btn{flex:1 1 auto}
.recap .btn.ghost{color:#F4F0FF;background:rgba(255,255,255,.08)}
.recap .btn:focus-visible,.recap .lb-btn:focus-visible,.recap .place:focus-visible{outline:3px solid var(--fly);outline-offset:3px}

.toast{position:fixed;left:50%;bottom:calc(118px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:16px;font-weight:700;font-size:14px;z-index:80;width:max-content;max-width:calc(100% - 32px);text-align:center;box-shadow:var(--shadow-lg)}

@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* standalone page (GitHub Pages) */
html,body{margin:0}
html{-webkit-text-size-adjust:100%}
body{-webkit-tap-highlight-color:transparent;min-height:100vh}
body.gated .app,body.gated .tabs,body.gated .flies{display:none}
.gate{min-height:100vh;min-height:100dvh;background:var(--bg)}
.gate-in{max-width:440px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 24px) 20px calc(env(safe-area-inset-bottom,0px) + 36px)}
.gate-fig{position:relative;display:flex;justify-content:center;padding:16px 18px 6px;border-radius:28px;background:#1F1A36;overflow:hidden;margin-bottom:22px}
.gate-fig svg{width:min(180px,48vw);height:auto;position:relative}
.gate-fig .fx{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--fly-hi);box-shadow:0 0 10px 4px rgba(255,216,102,.5);animation:blink 4.2s ease-in-out infinite alternate}
.gate-fig .fx:nth-of-type(1){top:22px;left:28px}

.gate-fig .fx:nth-of-type(3){bottom:30px;left:56px;width:4px;height:4px;animation-delay:-2.8s}
.gate-h{margin:0 0 4px;font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1.1;outline:none}
.gate-p{margin:0;color:var(--muted);font-weight:600;text-wrap:pretty}
.gate .form{gap:14px}
.gate .btn.primary{width:100%}
.gate input[type=text],input[type=email],input[type=password],.gate input[type=email],.gate input[type=password]{background:var(--surface)}
.gate .link-btn{align-self:center}
.gate-tip{display:flex;gap:10px;align-items:flex-start;margin-top:20px;padding:12px 14px;border-radius:16px;background:var(--fly-soft);font-size:14px;font-weight:600;line-height:1.45}
.gate-tip svg{flex:none;margin-top:2px;width:16px;height:16px;color:var(--fly-deep)}
.gate-tip b{font-weight:800}
.code-in{letter-spacing:.3em;font-size:22px!important;text-align:center;font-variant-numeric:tabular-nums}
.av-pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.av-opt{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 10px;border-radius:18px;background:var(--surface);border:2px solid var(--line);cursor:pointer;font-weight:700;font-size:14px;text-align:center}
.sheet .av-opt{background:var(--bg)}
.av-opt input{position:absolute;opacity:0;pointer-events:none}
.av-opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--accent-soft-ink)}
.av-opt:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.av-opt .av{width:56px;height:56px;font-size:24px}
.me-row{display:flex;align-items:center;gap:12px;min-width:0}
.me-row .av{width:42px;height:42px;font-size:18px}

/* Every shared record lives in one table "docs" (col = ideas | jars | couple | profiles, id, data as JSON).

const CFG = window.IDEENGLAS_CONFIG || {};
const CFG_OK = !!(CFG.url && CFG.key && !/DEIN-PROJEKT|DEIN-KEY/.test(CFG.url + CFG.key));
const LOGIN = CFG.login === 'code' ? 'code' : 'password';
const sb = (CFG_OK && window.supabase && typeof window.supabase.createClient === 'function')
  ? window.supabase.createClient(CFG.url, CFG.key, {auth: {persistSession: true, autoRefreshToken: true, detectSessionInUrl: false, storageKey: 'ideenglas.auth'}})
  : null;
const BUCKET = 'fotos';
const COLS = ['ideas', 'jars', 'couple', 'profiles'];
const store = {maps: {ideas: new Map(), jars: new Map(), couple: new Map(), profiles: new Map()}, secrets: new Map(), queues: new Map(), channel: null, down: false, lastSync: 0};
function enqueue(key, fn){ const prev = store.queues.get(key) || Promise.resolve(); const next = prev.catch(() => {}).then(fn); store.queues.set(key, next); return next; }
function sbErr(error){ const e = new Error((error && error.message) || 'error'); e.code = (error && (error.code || error.error)) || 'error'; e.status = error && (error.status || error.statusCode); return e; }
async function run(q){ const {data, error} = await q; if (error) throw sbErr(error); return data; }
async function withRetry(fn){ try { return await fn(); } catch (e) { if (!navigator.onLine || (e && /fetch|network/i.test(e.message || ''))) { await sleep(900); return fn(); } throw e; } }
async function guarded(key, fn){ try { return await enqueue(key, () => withRetry(fn)); } catch (e) { onWriteError(e); throw e; } }
function onWriteError(e){
  const st = Number(e && e.status), msg = String((e && e.message) || '');
  if (!navigator.onLine) toast('Keine Internetverbindung. Versuch es gleich nochmal.');
  else if (st === 401 || /JWT|token/i.test(msg)) toast('Deine Anmeldung ist abgelaufen. Schließ die App und öffne sie neu.');
  else if (st === 403 || /row-level security|permission/i.test(msg)) toast('Speichern ist nicht erlaubt. Ist der Datenbank-Schritt vollständig gelaufen?');
  else toast('Speichern hat nicht geklappt. Versuch es nochmal.');

/* JSON merge patch: objects merge, null removes a key, everything else replaces (same rule as patch_doc in the database) */
function mergePatch(a, b){
  const o = (a && typeof a === 'object' && !Array.isArray(a)) ? {...a} : {};
  for (const k in b) {
    const v = b[k];
    if (v === null || v === undefined) delete o[k];
    else if (typeof v === 'object' && !Array.isArray(v)) o[k] = mergePatch(o[k], v);
    else o[k] = v;
  }

}
let afterQueued = false;
function emit(c){
  if (c === 'secrets') { const o = {}; store.secrets.forEach((v, k) => { o[k] = v; }); state.secrets = o; }
  else if (c === 'profiles') { const o = {}; store.maps.profiles.forEach((v, k) => { o[k] = {...v, id: k}; }); state.profiles = o; }
  else if (store.maps[c]) state[c] = [...store.maps[c].entries()].map(([id, v]) => ({...v, id}));
  if (!afterQueued) { afterQueued = true; Promise.resolve().then(() => { afterQueued = false; afterData(); }); }
}

async function setDoc(c, id, data){
  const d = clean(data);

  return guarded(c + '/' + id, () => run(sb.from('docs').upsert({col: c, id, data: d, updated_at: new Date().toISOString()})));
}
async function addDoc(c, data){ const id = newId(); await setDoc(c, id, data); return id; }
async function updateDoc(c, id, patch){
  const p = clean(patch), cur = store.maps[c].get(id);
  if (cur) { store.maps[c].set(id, mergePatch(cur, p)); emit(c); }
  /* JSON keeps the nulls, and the database needs them to clear fields */
  return guarded(c + '/' + id, () => run(sb.rpc('patch_doc', {p_col: c, p_id: id, p_patch: p})));

async function setSecret(ideaId, data){

/* loading everything, and staying in sync */
async function fetchAll(){
  const rows = [];
  for (let from = 0; ; from += 1000) {
    const data = await run(sb.from('docs').select('col,id,data').order('col').order('id').range(from, from + 999));
    rows.push(...data); if (data.length < 1000) break;
  }
  const maps = {ideas: new Map(), jars: new Map(), couple: new Map(), profiles: new Map()};
  rows.forEach(r => { if (maps[r.col]) maps[r.col].set(r.id, r.data || {}); });
  const sec = await run(sb.from('secrets').select('id,data').eq('owner', state.me));
  store.maps = maps; store.secrets = new Map(sec.map(r => [r.id, r.data || {}]));
  store.lastSync = Date.now();
  state.loaded = true; state.jarsLoaded = true; state.loadError = false;
  COLS.forEach(emit); emit('secrets');
}
let resyncing = null;
function resync(){
  if (!sb || !state.me) return Promise.resolve();
  if (!resyncing) resyncing = fetchAll().catch(() => {}).finally(() => { resyncing = null; });
  return resyncing;
}
function connect(){
  if (store.channel) { try { sb.removeChannel(store.channel); } catch (e) {} }
  store.channel = sb.channel('ideenglas')
    .on('postgres_changes', {event: '*', schema: 'public', table: 'docs'}, p => {
      const del = p.eventType === 'DELETE', row = del ? p.old : p.new;
      if (!row || !store.maps[row.col]) return;
      if (del) store.maps[row.col].delete(row.id); else store.maps[row.col].set(row.id, row.data || {});
      emit(row.col);
    })
    .on('postgres_changes', {event: '*', schema: 'public', table: 'secrets'}, p => {
      const del = p.eventType === 'DELETE', row = del ? p.old : p.new;
      if (!row || row.owner !== state.me) return;
      if (del) store.secrets.delete(row.id); else store.secrets.set(row.id, row.data || {});
      emit('secrets');
    })
    .subscribe(status => {
      if (status === 'SUBSCRIBED') { if (store.down) resync(); store.down = false; }
      else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED') store.down = true;
    });
}

const BLANK = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';

  const c = photoCache[id];
  if (c && c.exp > Date.now() + 36e5) return c.url;

  photoT = 0; const ids = [...photoWant]; photoWant.clear();
  if (!ids.length || !sb) return;
  try {
    const data = await run(sb.storage.from(BUCKET).createSignedUrls(ids, 7 * 86400));
    const exp = Date.now() + 7 * 864e5 - 6e5;
    (data || []).forEach(d => { if (d && d.signedUrl && d.path) photoCache[d.path] = {url: d.signedUrl, exp}; });
    const keys = Object.keys(photoCache);
    if (keys.length > 600) keys.sort((a, b) => photoCache[a].exp - photoCache[b].exp).slice(0, keys.length - 600).forEach(k => delete photoCache[k]);
    lsSet('ideenglas.photos', JSON.stringify(photoCache));
    document.querySelectorAll('img[data-pid]').forEach(img => { const c = photoCache[img.dataset.pid]; if (c && img.getAttribute('src') !== c.url) { img.classList.remove('broken'); img.src = c.url; } });
  } catch (e) {}
}
const assetsStore = {
  async upload(blob){
    const t = blob.type || 'image/jpeg', ext = t === 'image/png' ? 'png' : t === 'image/webp' ? 'webp' : t === 'image/gif' ? 'gif' : 'jpg';
    const id = newId() + '.' + ext;
    const {error} = await sb.storage.from(BUCKET).upload(id, blob, {contentType: t, cacheControl: '31536000', upsert: false});
    if (error) {
      const e = sbErr(error), m = String(error.message || '') + ' ' + String(error.statusCode || error.status || '');
      e.code = /413|too large|size/i.test(m) ? 'too_large' : /mime|type/i.test(m) ? 'unsupported_type' : /403|row-level|policy|unauthorized/i.test(m) ? 'not_allowed' : /bucket/i.test(m) ? 'no_bucket' : 'upstream_error';

    }

  },
  async delete(id){ const {error} = await sb.storage.from(BUCKET).remove([id]); if (error) throw sbErr(error); delete photoCache[id]; return {deleted: true}; }
};
async function deleteAssets(ids){
  if (!state.assets || !ids || !ids.length) return;
  for (const id of ids) { try { await state.assets.delete(id); } catch (e) {} }
}
function loadImg(url){ return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = url; }); }
async function shrink(file){
  const url = URL.createObjectURL(file);
  try {
    const img = await loadImg(url);
    const max = 1600, sc = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const w = Math.max(1, Math.round(img.naturalWidth * sc)), h = Math.max(1, Math.round(img.naturalHeight * sc));
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    c.getContext('2d').drawImage(img, 0, 0, w, h);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.82));
    if (blob && blob.size) return blob;
  } catch (e) {} finally { URL.revokeObjectURL(url); }
  if (/^image\/(jpeg|png|webp|gif)$/.test(file.type)) return file;
  const err = new Error('format'); err.code = 'unsupported_type'; throw err;
}
async function uploadPhoto(file){
  const blob = await shrink(file);

  catch (e) { if (e && e.code === 'upstream_error' && navigator.onLine) { await sleep(800); return state.assets.upload(blob); } throw e; }
}
function photoError(e){
  const c = e && e.code;
  if (!navigator.onLine) return 'Keine Internetverbindung. Die Fotos wurden noch nicht hochgeladen.';
  if (c === 'too_large') return 'Ein Foto ist zu groß.';
  if (c === 'unsupported_type') return 'Dieses Bildformat geht leider nicht. Versuch es mit einem JPG oder PNG.';
  if (c === 'not_allowed') return 'Fotos hochladen ist nicht erlaubt. Ist der Datenbank-Schritt vollständig gelaufen?';
  if (c === 'no_bucket') return 'Der Fotospeicher fehlt noch. Ist der Datenbank-Schritt vollständig gelaufen?';
  return 'Ein Foto ließ sich nicht hochladen. Versuch es nochmal.';
}

/* "Weißt du noch?": a memory from exactly a month or a year ago, otherwise one older memory per day, photos first */
function rememberPick(){
  const done = state.ideas.filter(i => statusOf(i) === 'done' && i.doneDate);
  if (!done.length) return null;
  const t = parseD(todayStr());
  let best = null;
  done.forEach(i => {
    const d = parseD(i.doneDate), months = (t.getFullYear() - d.getFullYear()) * 12 + (t.getMonth() - d.getMonth());
    if (months >= 1 && d.getDate() === t.getDate() && (!best || months > best.months)) best = {i, months};
  });
  if (best) {
    const y = best.months / 12;
    return {i: best.i, why: best.months % 12 === 0 ? `Heute vor ${y === 1 ? 'einem Jahr' : y + ' Jahren'}` : `Heute vor ${best.months === 1 ? 'einem Monat' : best.months + ' Monaten'}`};
  }
  const old = done.filter(i => dayDiff(parseD(i.doneDate), t) >= 7);
  if (!old.length) return null;
  const withPh = old.filter(i => (i.photos || []).length);
  const pool = (withPh.length ? withPh : old).sort((a, b) => String(a.id).localeCompare(String(b.id)));
  const pick = pool[hash(todayStr()) % pool.length];
  const dd = dayDiff(parseD(pick.doneDate), t), w = Math.round(dd / 7), m = Math.round(dd / 30.4), y = Math.floor(dd / 365);
  const why = dd < 30 ? `Vor ${w === 1 ? 'einer Woche' : w + ' Wochen'}` : dd < 365 ? `Vor ${m <= 1 ? 'einem Monat' : m + ' Monaten'}` : `Vor ${y === 1 ? 'einem Jahr' : y + ' Jahren'}`;
  return {i: pick, why};
}

function bindSwipe(card){
  if (!card) return;
  let sx = 0, sy = 0, dx = 0, dy = 0, drag = false, pid = null;
  card.addEventListener('pointerdown', e => {
    if (e.button !== undefined && e.button !== 0) return;
    drag = true; pid = e.pointerId; sx = e.clientX; sy = e.clientY; dx = dy = 0;
    card.style.transition = 'none';
    try { card.setPointerCapture(pid); } catch (err) {}
  });
  card.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== pid) return;
    dx = e.clientX - sx; dy = e.clientY - sy;
    card.style.transform = `translate(${dx}px, ${dy * 0.25}px) rotate(${dx / 16}deg)`;
    card.dataset.dir = dx > 40 ? 'yes' : dx < -40 ? 'no' : '';
  });
  const end = () => {
    if (!drag) return; drag = false;
    card.style.transition = '';
    if (Math.abs(dx) > 90) fling(card, dx > 0);
    else { card.style.transform = ''; card.dataset.dir = ''; }
  };
  card.addEventListener('pointerup', end);
  card.addEventListener('pointercancel', end);
}
function fling(card, yes){
  const id = card.dataset.id;
  if (state.pending.has(id)) return;
  state.pending.add(id);
  card.dataset.dir = yes ? 'yes' : 'no';
  card.style.pointerEvents = 'none';
  card.style.transition = 'transform .22s ease-in, opacity .22s ease-in';
  card.style.transform = `translate(${yes ? 140 : -140}%, 20px) rotate(${yes ? 20 : -20}deg)`;
  card.style.opacity = '0';
  setTimeout(() => castVote(id, yes), reduceMotion() ? 0 : 210);
}
async function castVote(id, yes){
  const i = find(id), me = actor();
  if (!i || !me) { state.pending.delete(id); render(); return; }
  const othersYes = likers(i).some(x => x !== me);
  state.lastVote = {id, prev: voteOf(i, me)};
  const patch = {likes: {[me]: yes}};
  if (yes && othersYes) { patch.matchedAt = Date.now(); patch.matchedBy = me; }
  try { await updateDoc('ideas', id, patch); }
  catch (e) { state.lastVote = null; }
  state.pending.delete(id);
  if (yes && othersYes) state.matchNote = id;
  render();
  const top = $('#card-top'); if (top) top.focus({preventScroll:true});
}
function voteTop(yes){ const top = $('#card-top'); if (top) fling(top, yes); }
function laterTop(){
  const top = $('#card-top'); if (!top) return;
  const id = top.dataset.id;
  if (state.pending.has(id)) return;
  if (freshFor(curJar().id, actor()).length <= 1) { toast('Das ist gerade der einzige offene Zettel.'); return; }
  top.style.pointerEvents = 'none';
  top.classList.add('later-out');
  setTimeout(() => {
    state.skips[id] = Date.now(); saveSkips(); render();
    const t = $('#card-top'); if (t) t.focus({preventScroll:true});
  }, reduceMotion() ? 0 : 220);
}
async function undo(){
  const lv = state.lastVote; if (!lv) return;
  state.lastVote = null;
  if (state.matchNote === lv.id) state.matchNote = null;
  try { await updateDoc('ideas', lv.id, {likes: {[actor()]: lv.prev}}); toast('Stimme zurückgenommen.'); } catch (e) {}
  render();
}
async function draw(){
  let c = candidates(); if (!c.length) return;
  if (c.length > 1 && state.drawn) c = c.filter(i => i.id !== state.drawn);
  const pick = c[Math.floor(Math.random() * c.length)];
  if (!reduceMotion()) { state.drawn = null; state.shake = true; render(); await sleep(560); state.shake = false; }
  state.drawn = pick.id; state.drawAnim = !reduceMotion(); render();
  const card = $('#drawn');
  if (card) { card.focus({preventScroll:true}); card.scrollIntoView({block:'center', behavior: reduceMotion() ? 'auto' : 'smooth'}); }
}

/* one equal tile per day you saved: its own number, what it counts, and when it comes round next */
function dayTiles(){
  const D = days(), t = parseD(todayStr()), tiles = [];
  const plural = (n, one, many) => n === 1 ? one : many;
  const sinceTile = (dateStr, icon, k, what) => {
    const o = parseD(dateStr), n = dayDiff(o, t);
    if (n < 0) return {icon, k, n: -n, u: plural(-n, 'Tag bis dahin', 'Tage bis dahin'), s: 'am ' + F_LONG.format(o)};
    const r = nextYearly(dateStr, t), d = dayDiff(t, r.date);
    const next = r.n > 0 ? (d === 0 ? `Heute: ${yearsLabel(r.n, what)}!` : `${r.n}. Jahrestag ${d === 1 ? 'morgen' : 'in ' + d + ' Tagen'}`) : '';
    return {icon, k, n, u: plural(n, 'Tag her', 'Tage her'), s: F_LONG.format(o) + (next ? ' · ' + next : ''), today: r.n > 0 && d === 0};
  };
  if (D.together) {
    const tt = togetherText();
    tiles.push({icon: 'heart', k: 'Zusammen', n: Math.abs(tt.total), u: tt.total < 0 ? plural(-tt.total, 'Tag bis zum Start', 'Tage bis zum Start') : plural(tt.total, 'Tag zusammen', 'Tage zusammen'), s: tt.sub, today: specialDays(0).some(u => /zusammen|Jahrestag/.test(u.label))});
  }
  if (D.met) tiles.push(sinceTile(D.met, 'sparkle', 'Kennengelernt', 'seit dem Kennenlernen'));
  if (D.first) tiles.push(sinceTile(D.first, 'glow', 'Erstes Date', 'seit dem ersten Date'));
  (D.custom || []).filter(c => c && c.date).map(c => {
    const icon = /geburt/i.test(c.label || '') ? 'gift' : 'cal';
    if (c.yearly === false) {
      const o = parseD(c.date), n = dayDiff(t, o);
      return n >= 0
        ? {icon, k: c.label || 'Besonderer Tag', n, u: n === 0 ? 'Heute!' : plural(n, 'Tag bis dahin', 'Tage bis dahin'), s: F_LONG.format(o), today: n === 0, sort: n}
        : {icon, k: c.label || 'Besonderer Tag', n: -n, u: plural(-n, 'Tag her', 'Tage her'), s: F_LONG.format(o), sort: 9999};
    }
    const r = nextYearly(c.date, t), d = dayDiff(t, r.date);
    return {icon, k: c.label || 'Besonderer Tag', n: d, u: d === 0 ? 'Heute!' : plural(d, 'Tag bis dahin', 'Tage bis dahin'), s: F_SHORT.format(r.date) + ' · jedes Jahr', today: d === 0, sort: d};
  }).sort((a, b) => a.sort - b.sort).forEach(x => tiles.push(x));
  return tiles;
}

  return `<section class="deep" aria-label="Unsere Tage">${fx}${head}${grid}${list}</section>`;

/* which option the receiver tapped; a single option counts as picked, past dates never */

/* ---------- Rückblick: one page per special experience ---------- */
function collageCells(n){
  if (n === 1) return ['solo'];
  if (n === 2) return ['big', 'tall'];
  const out = ['big', '', ''], cycle = [['', '', ''], ['wide', ''], ['bigr', '', ''], ['', 'wide']];
  let k = 3, step = 0;
  while (k < n) {
    let u = cycle[step % cycle.length];
    if (u.length > n - k) u = n - k === 1 ? ['full'] : ['wide', ''];
    u.forEach(c => out.push(c)); k += u.length; step++;
  }
  return out;
}
