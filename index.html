  if (state.gate) return;
  if (state.lightbox) {
    if (e.key === 'Escape') { e.preventDefault(); closeLightbox(); }
    else if (e.key === 'ArrowRight') { state.lightbox.k++; renderLightbox(); }
    else if (e.key === 'ArrowLeft') { state.lightbox.k--; renderLightbox(); }
    return;
  }
  if (state.recap) {
    if (e.key === 'Escape') { e.preventDefault(); closeRecap(); }
    else if (e.key === 'Tab') {
      const f = [...$('#recap').querySelectorAll('button, a[href]')].filter(x => x.offsetParent !== null);
      if (f.length) { const first = f[0], last = f[f.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); } }
    }
    return;
  }
  if (!state.sheet) {
    const tag = (e.target && e.target.tagName) || '';
    if (currentTab() === 'einigen' && !/INPUT|TEXTAREA|SELECT/.test(tag)) {
      if (e.key === 'ArrowRight') { e.preventDefault(); voteTop(true); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); voteTop(false); }
      else if (e.key === 'ArrowDown' && $('#card-top')) { e.preventDefault(); laterTop(); }
    }
    return;
  }
  if (e.key === 'Escape') { closeSheet(); render(); return; }
  if (e.key !== 'Tab') return;
  const f = [...$('#sheet').querySelectorAll('button:not([disabled]), input:not([type=radio]):not([disabled]), input[type=radio]:checked, textarea, a[href]')].filter(x => x.offsetParent !== null);
  if (!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
});
$('#lightbox').addEventListener('click', e => { if (e.target.id === 'lightbox') closeLightbox(); });
window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') markSeen();
  else if (actor()) { const v = Number(lsGet('ideenglas.seen.' + actor())) || null; if (v) state.since = v; render(); }
});
window.addEventListener('pagehide', markSeen);

let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 3000); }

function afterData(){
  if (state.drawn) { const d = find(state.drawn); if (!d || statusOf(d) !== 'open') state.drawn = null; }
  if (state.matchNote) { const d = find(state.matchNote); if (!d || statusOf(d) !== 'open') state.matchNote = null; }
  if (state.lastVote && !find(state.lastVote.id)) state.lastVote = null;
  if (state.loaded && state.jarsLoaded && !allJars().some(j => j.id === state.jar)) setJar('aktivitaeten');
  const s = state.sheet;
  if (s && s.id && !find(s.id) && !['settings', 'days', 'surprise'].includes(s.type)) closeSheet();
  render();
  if (state.sheet && ['idea', 'suggest', 'drawfilter', 'glasfilter', 'settings'].includes(state.sheet.type)) renderSheet();
  if (state.recap) renderRecap();
  if (state.lightbox) renderLightbox();
  refreshProfiles();
}

/* ---------- sign-in, first-time profile, connection problems ---------- */
const isStandalone = () => !!(navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches));
const isIOS = () => /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
function showGate(kind, opts){
  state.gate = {kind, ...(opts || {})};
  document.body.classList.add('gated');
  if (state.sheet) closeSheet();
  renderGate(true);
}
function hideGate(){
  state.gate = null; document.body.classList.remove('gated');
  const g = $('#gate'); g.hidden = true; g.innerHTML = '';
}
function gateFig(){
  return `<div class="gate-fig"><span class="fx" aria-hidden="true"></span><span class="fx" aria-hidden="true"></span><span class="fx" aria-hidden="true"></span>${jarSVG(6, 'Waschbär im Glas')}</div>`;
}
function homeTip(){
  if (isStandalone() || !isIOS()) return '';
  return `<div class="gate-tip">${ico('sparkle', 16, 2.2)}<span><b>Tipp vor dem Anmelden:</b> Tippe in Safari unten auf <b>Teilen</b> und dann auf <b>„Zum Home-Bildschirm“</b>. Öffne das Glas danach über das neue Symbol und melde dich dort an. So startet es wie eine App.</span></div>`;
}
function profileFields(p){
  const fig = !!(p && p.figure), name = (p && p.name) || '';
  const letter = (firstName(name) || '?').charAt(0).toUpperCase();
  return `<div class="field"><label class="lbl" for="p-name">Wie heißt du?</label><input id="p-name" type="text" maxlength="30" autocomplete="given-name" placeholder="Dein Vorname" value="${esc(name)}"><p class="err" id="p-name-err" hidden>Schreib kurz deinen Namen hin.</p></div>
    <fieldset class="field"><legend class="lbl">Dein Bild in der App</legend>
      <div class="av-pick">
        <label class="av-opt" for="p-fig-0"><input type="radio" name="p-fig" id="p-fig-0" value="0" ${fig ? '' : 'checked'}><span class="av" id="p-letter">${esc(letter)}</span><span>Anfangsbuchstabe</span></label>
        <label class="av-opt" for="p-fig-1"><input type="radio" name="p-fig" id="p-fig-1" value="1" ${fig ? 'checked' : ''}><span class="av">${figureSVG()}</span><span>Gezeichnete Figur</span></label>
      </div></fieldset>`;
}
function renderGate(initial){
  const g = state.gate, box = $('#gate'); if (!g) return;
  let inner = '';
  if (g.kind === 'config') {
    inner = `<h1 class="gate-h">Fast geschafft</h1><p class="gate-p">In der Datei <b>config.js</b> fehlen noch die Adresse und der Schlüssel eures Supabase-Projekts. Trag beides dort ein und lade die Seite neu.</p>`;
  } else if (g.kind === 'offline') {
    inner = `<h1 class="gate-h">Keine Verbindung</h1><p class="gate-p">${esc(g.msg || 'Das Glas lässt sich gerade nicht öffnen. Prüf das Internet und versuch es nochmal.')}</p><button class="btn primary" data-action="gate-retry">Nochmal versuchen</button>`;
  } else if (g.kind === 'login' && LOGIN === 'password') {
    inner = `<form id="f-login" class="form" novalidate>
      <div><h1 class="gate-h" id="gate-h" tabindex="-1">Unser Ideenglas</h1><p class="gate-p">Melde dich an. Danach bleibst du auf diesem Handy angemeldet.</p></div>
      <div class="field"><label class="lbl" for="l-mail">E-Mail</label><input id="l-mail" type="email" autocomplete="username" inputmode="email" autocapitalize="off" spellcheck="false" value="${esc(g.email || '')}"></div>
      <div class="field"><label class="lbl" for="l-pass">Passwort</label><input id="l-pass" type="password" autocomplete="current-password"></div>
      <p class="err" id="l-err" role="alert" hidden></p>
      <button class="btn primary" type="submit">Anmelden</button>
    </form>${homeTip()}`;
  } else if (g.kind === 'login') {
    inner = `<form id="f-login" class="form" novalidate>
      <div><h1 class="gate-h" id="gate-h" tabindex="-1">Unser Ideenglas</h1><p class="gate-p">Gib deine E-Mail-Adresse ein. Du bekommst einen Code, mit dem du dich anmeldest. Danach bleibst du auf diesem Handy angemeldet.</p></div>
      <div class="field"><label class="lbl" for="l-mail">E-Mail</label><input id="l-mail" type="email" autocomplete="email" inputmode="email" autocapitalize="off" spellcheck="false" value="${esc(g.email || '')}"></div>
      <p class="err" id="l-err" role="alert" hidden></p>
      <button class="btn primary" type="submit">Code schicken</button>
    </form>${homeTip()}`;
  } else if (g.kind === 'code') {
    inner = `<form id="f-code" class="form" novalidate>
      <div><h1 class="gate-h" id="gate-h" tabindex="-1">Schau in dein Postfach</h1><p class="gate-p">Wir haben einen Code an <b>${esc(g.email)}</b> geschickt. Gib ihn hier ein.</p></div>
      <div class="field"><label class="lbl" for="l-code">Code</label><input id="l-code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="10" pattern="[0-9]*" class="code-in"></div>
      <p class="err" id="l-err" role="alert" hidden></p>
      <button class="btn primary" type="submit">Anmelden</button>
      <button class="link-btn" type="button" data-action="gate-back">Andere E-Mail-Adresse</button>
    </form>`;
  } else if (g.kind === 'profile') {
    inner = `<form id="f-profile" class="form" novalidate>
      <div><h1 class="gate-h" id="gate-h" tabindex="-1">Schön, dass du da bist</h1><p class="gate-p">Noch zwei Kleinigkeiten, dann geht’s los.</p></div>
      ${profileFields(state.profiles[state.me])}
      <button class="btn primary" type="submit">Los geht’s</button>
    </form>`;
  }
  box.innerHTML = `<div class="gate-in">${gateFig()}${inner}</div>`;
  box.hidden = false;
  if (initial) { window.scrollTo(0, 0); const f = box.querySelector('input:not([type=radio])') || box.querySelector('.btn'); if (f && !isIOS()) f.focus({preventScroll:true}); }
}
function loginError(e){
  const m = String((e && (e.message || e.code)) || '');
  if (!navigator.onLine || /fetch|network/i.test(m)) return 'Keine Internetverbindung. Versuch es gleich nochmal.';
  if (/invalid login|invalid_credentials|Invalid login credentials/i.test(m)) return 'E-Mail oder Passwort stimmt nicht.';
  if (/not confirmed/i.test(m)) return 'Diese E-Mail ist in Supabase noch nicht bestätigt.';
  if (/signups not allowed|not found|user not found/i.test(m)) return 'Für diese E-Mail gibt es noch kein Konto.';
  if (/not authorized/i.test(m)) return 'Supabase darf an diese Adresse noch keine Mails schicken.';
  if (/rate limit|too many|security purposes/i.test(m)) return 'Gerade wurden zu viele Codes verschickt. Warte etwas und versuch es dann nochmal.';
  if (/expired|invalid.*otp|token/i.test(m)) return 'Der Code stimmt nicht oder ist abgelaufen. Lass dir einen neuen schicken.';
  return 'Das hat nicht geklappt. Versuch es nochmal.';
}
function gateErr(msg){ const el = $('#l-err'); if (el) { el.textContent = msg; el.hidden = false; } }
async function submitLogin(form){
  const email = $('#l-mail').value.trim().toLowerCase();
  if (!/^\S+@\S+\.\S+$/.test(email)) { gateErr('Gib deine E-Mail-Adresse ein.'); $('#l-mail').focus(); return; }
  const btn = form.querySelector('[type=submit]'); btn.disabled = true; $('#l-err').hidden = true;
  try {
    if (LOGIN === 'password') {
      const pass = $('#l-pass').value;
      if (!pass) { gateErr('Gib dein Passwort ein.'); $('#l-pass').focus(); btn.disabled = false; return; }
      const {data, error} = await sb.auth.signInWithPassword({email, password: pass});
      if (error) throw error;
      await start(data.user);
    } else {
      const {error} = await sb.auth.signInWithOtp({email, options: {shouldCreateUser: false}});
      if (error) throw error;
      showGate('code', {email});
    }
  } catch (e) { gateErr(loginError(e)); btn.disabled = false; }
}
async function submitCode(form){
  const token = $('#l-code').value.replace(/\D/g, '');
  if (token.length < 6) { gateErr('Gib den Code aus der E-Mail ein.'); $('#l-code').focus(); return; }
  const btn = form.querySelector('[type=submit]'); btn.disabled = true;
  try {
    const {data, error} = await sb.auth.verifyOtp({email: state.gate.email, token, type: 'email'});
    if (error) throw error;
    await start(data.user);
  } catch (e) { gateErr(loginError(e)); btn.disabled = false; }
}
function readProfileForm(){
  const name = $('#p-name').value.trim();
  if (!name) { $('#p-name-err').hidden = false; $('#p-name').focus(); return null; }
  return {name, figure: $('#p-fig-1').checked};
}
async function submitProfile(form){
  const p = readProfileForm(); if (!p) return;
  const btn = form.querySelector('[type=submit]'); btn.disabled = true;
  try {
    await setDoc('profiles', state.me, {...(state.profiles[state.me] || {}), ...p, id: undefined});
    if (state.gate) { hideGate(); render(); toast(`Hallo ${firstName(p.name)}!`); }
    else { toast('Gespeichert.'); openSheet('settings'); }
  } catch (e) { btn.disabled = false; }
}

/* ---------- start ---------- */
async function start(user){
  state.me = user.id; state.email = user.email || ''; state.mode = 'db'; state.assets = assetsStore; state.readOnly = false;
  hideGate(); loadViewerPrefs(); render();
  try { await fetchAll(); }
  catch (e) {
    const st = Number(e && e.status);
    if (st === 401) { try { await sb.auth.signOut(); } catch (x) {} showGate('login'); return; }
    showGate('offline', {msg: /relation|does not exist|schema cache|PGRST2/i.test(String(e && e.message)) ? 'Die Datenbank ist noch nicht eingerichtet. Führe zuerst den Datenbank-Schritt in Supabase aus.' : ''});
    return;
  }
  connect();
  const p = state.profiles[state.me];
  if (!p || !p.name) showGate('profile');
  render();
}
async function init(){
  applyAccent();
  if (!CFG_OK) { showGate('config'); return; }
  if (!sb) { showGate('offline', {msg: 'Ein Baustein der App ließ sich nicht laden. Prüf das Internet und versuch es nochmal.'}); return; }
  render();
  sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT' && state.me) location.reload(); });
  let session = null;
  try { const {data} = await sb.auth.getSession(); session = data && data.session; } catch (e) {}
  if (!session) { showGate('login'); return; }
  await start(session.user);
}
async function signOut(){
  try { await sb.auth.signOut(); } catch (e) {}
  location.reload();
}
async function submitPassword(form){
  const a = $('#pw-new').value, b = $('#pw-new2').value, err = $('#pw-err');
  if (a.length < 8) { err.textContent = 'Das Passwort braucht mindestens 8 Zeichen.'; err.hidden = false; $('#pw-new').focus(); return; }
  if (a !== b) { err.textContent = 'Die beiden Passwörter sind nicht gleich.'; err.hidden = false; $('#pw-new2').focus(); return; }
  const btn = form.querySelector('[type=submit]'); btn.disabled = true;
  try {
    const {error} = await sb.auth.updateUser({password: a});
    if (error) throw error;
    toast('Neues Passwort gespeichert.'); openSheet('settings');
  } catch (e) {
    err.textContent = /different|same/i.test(String(e.message)) ? 'Das ist schon dein aktuelles Passwort.' : /weak|short/i.test(String(e.message)) ? 'Das Passwort ist zu schwach. Nimm ein längeres.' : 'Das hat nicht geklappt. Versuch es nochmal.';
    err.hidden = false; btn.disabled = false;
  }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && state.me && Date.now() - store.lastSync > 15000) resync();
});
window.addEventListener('online', () => { if (state.me) resync(); render(); });
window.addEventListener('offline', () => render());
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
init();
})();
</script>
