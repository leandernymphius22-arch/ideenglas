/* type: serif for headings and big numbers, body font for small labels */
h1,h2,h3,.sec,.month,.page-h h1,.brand h1,.sheet-h,.sc-title,.card-title,.lit-title,.empty-h,.gate-h,.trip-h,.recap-h,.recap-sec{font-weight:400;letter-spacing:-.005em}
.page-h h1{font-size:32px;line-height:1.05}
.page-h p{margin-top:4px}
.sec{font-size:20px;font-weight:400}
.month{font-size:22px;font-weight:400}
.sheet-h{font-size:26px}
.sc-title{font-size:25px}
.card-title{font-size:32px;line-height:1.04}
.lit-title{font-size:25px}
.empty-h{font-size:26px}
.gate-h{font-size:32px}
.memo-title{font-size:21px;font-weight:400}
.pinned-main h2{font-size:22px;font-weight:400}
.tripnow h2{font-size:22px}
.stat b{font-weight:400;font-size:30px;line-height:1.05}
.days-num{font-weight:400;font-size:52px}
.days-lbl{font-family:var(--f-body);font-weight:700;font-size:16px}
.dg-n{font-weight:400}
.dt-d{font-weight:400;font-size:23px}
.drawbox h2{font-size:19px}
.recap-quote blockquote{font-weight:400}
.rstop-note{font-weight:400}
.news-head b,.freshnote b,.status b,.set-item b,.opt-txt b,.sp-txt b,.matchnote b,.stamp,.btn.fly,.av,.stop-n,.stop-pin span,.trip-empty b{font-family:var(--f-body);font-weight:800}
.btn.fly{font-size:16px;font-weight:700}
.matchnote .mn-title{font-weight:400;font-size:20px}
.trip-top-t{font-weight:400;font-size:18px}
.tday-h{font-weight:400;font-size:20px}

/* glass cards */
.row,.stat,.news,.plan,.memo,.freshnote,.sugg,.drawbox,.geocard,.stop,.ti,.ti-progress,.ti-add,.nc-main{border:1px solid var(--glass-line)}
.sheet .sugg{border:0}
.chip{border:1px solid var(--glass-line);background:var(--surface)}
.chip.add{border:1.5px dashed var(--dash);background:transparent}
.iconbtn{border:1px solid var(--glass-line);background:var(--surface)}
.heartbtn{border:1px solid var(--glass-line)}
.seg{border:1px solid var(--glass-line)}
.seg button[aria-pressed="true"]{background:var(--seg-on);color:var(--seg-on-ink)}
.seg button[aria-pressed="true"] .ic-heart{color:var(--heart)}
.row-right .av{border-color:var(--surface-solid)}
.mapwrap{border:1px solid var(--glass-line)}
.deep{background:radial-gradient(130% 140% at 88% 0%,#3B3070 0%,#221B48 62%)}
.empty-fig{background:radial-gradient(130% 140% at 80% 0%,#3B3070 0%,#221B48 62%)}
.drawbox{box-shadow:none}

/* sheet, bars and overlays */
.sheet,.sheet-bar{background:var(--sheet)}
.trip{background:var(--bg) var(--page-img)}
.trip-top{background:var(--bar);-webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2)}
.trip-top .iconbtn{border:1px solid var(--glass-line);box-shadow:none}
.map-btn,.map-msg{background:var(--surface-solid)}
.recap{background:radial-gradient(130% 70% at 50% 0%,#2C2358 0%,#1A1538 55%,#100C22 100%)}

/* floating bottom bar */
.tabs{padding:0 12px calc(env(safe-area-inset-bottom,0px) + 10px)}
.tabs-in{max-width:520px;align-items:center;min-height:68px;padding:6px;border-radius:26px;background:var(--nav);border:1px solid var(--glass-line);box-shadow:0 18px 36px -22px rgba(20,14,48,.7);-webkit-backdrop-filter:blur(16px) saturate(1.3);backdrop-filter:blur(16px) saturate(1.3)}
.tab{min-height:54px;justify-content:center;gap:2px;font-size:11.5px}
.tab .tw{width:48px;height:28px}
.tab .tdot{border-color:var(--surface-solid)}
.addbtn{width:56px;height:56px;margin-top:-22px;border:0;border-radius:50%;background:var(--plus);color:var(--plus-ink);box-shadow:var(--plus-glow)}
.toast{bottom:calc(104px + env(safe-area-inset-bottom,0px))}

/* start page */
.hello{align-items:flex-start;margin-top:2px}
.hello-txt{min-width:0}
.hello-hi{margin:0;font-size:14px;font-weight:600;color:var(--muted)}
.hello-h{margin:0;font-weight:400;font-size:clamp(28px,8.4vw,34px);line-height:1.05;overflow-wrap:anywhere}
.hero{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;margin-top:8px}
.hero-jar{position:relative;width:min(178px,48vw);transform-origin:50% 90%}
.hero-jar::before{content:"";position:absolute;left:50%;top:60%;width:160%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(closest-side,rgba(255,216,102,.34),rgba(255,216,102,.12) 55%,transparent 100%);pointer-events:none}
.hero-jar svg{position:relative;display:block;width:100%;height:auto}
.hero-jar.shake{animation:shake .55s ease-in-out}
.hero-h{position:relative;margin:4px 0 0;font-size:28px;line-height:1.1}
.hero-p{position:relative;margin:4px 0 0;max-width:34ch;font-size:14.5px;font-weight:600;color:var(--muted);text-wrap:pretty}
.hero-btn{position:relative;margin-top:14px;min-width:210px;border-radius:999px;background:var(--plus);color:var(--plus-ink);box-shadow:var(--plus-glow)}
.nextcard{margin-top:16px}
.nextcard + .nextcard{margin-top:10px}
.nc-main{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border-radius:22px;background:var(--surface);box-shadow:var(--shadow);color:var(--ink);text-align:left;font:inherit;cursor:pointer}
.nc-main:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.nc-date{flex:none;width:50px;height:56px;border-radius:15px;background:#FFF0B8;color:#8A6410;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.nc-date span{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.nc-date b{margin-top:3px;font-family:var(--f-display);font-weight:400;font-size:24px}
.nc-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.nc-k{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#8A6410}
.nc-t{font-weight:700;font-size:16px;line-height:1.25;overflow-wrap:anywhere}
.nc-m{font-size:13px;font-weight:600;color:var(--muted);overflow-wrap:anywhere}
.nc-main > svg{flex:none;color:var(--muted)}
</style>
</head>

    for (let k = 1; k <= 12 * 80; k++) {
      const d = addMonths(s, k);
      if (dayDiff(t, d) > horizon) break;
      add(d, k % 12 === 0 ? `${k / 12}. Jahrestag` : `${k} ${k === 1 ? 'Monat' : 'Monate'} zusammen`);
    }
  }
  if (D.met) { const r = nextYearly(D.met, t); if (r.n > 0) add(r.date, yearsLabel(r.n, 'seit dem Kennenlernen')); }
  if (D.first) { const r = nextYearly(D.first, t); if (r.n > 0) add(r.date, yearsLabel(r.n, 'seit dem ersten Date')); }
  (D.custom || []).forEach(c => {
    if (!c || !c.date) return;
    if (c.yearly === false) add(parseD(c.date), c.label || 'Besonderer Tag');
    else { const r = nextYearly(c.date, t); add(r.date, c.label || 'Besonderer Tag'); }
  });
  out.sort((a, b) => a.diff - b.diff);
  return out;
}
function togetherText(){
  const D = days(); if (!D.together) return null;
  const s = parseD(D.together), t = parseD(todayStr());
  const total = dayDiff(s, t);
  if (total < 0) return {total, sub: `Ab ${F_LONG.format(s)}`};
  let m = (t.getFullYear() - s.getFullYear()) * 12 + (t.getMonth() - s.getMonth());
  if (addMonths(s, m) > t) m--;
  const rest = dayDiff(addMonths(s, m), t), y = Math.floor(m / 12), mm = m % 12;
  const parts = [];
  if (y) parts.push(`${y} ${y === 1 ? 'Jahr' : 'Jahre'}`);
  if (mm) parts.push(`${mm} ${mm === 1 ? 'Monat' : 'Monate'}`);
  if (rest || !parts.length) parts.push(`${rest} ${rest === 1 ? 'Tag' : 'Tage'}`);
  return {total, sub: `seit ${F_LONG.format(s)} · ${parts.join(', ')}`};
}

/* Every shared record lives in one table "docs" (col = ideas | jars | couple | profiles, id, data as JSON).
   Surprise details live in "secrets", which only their writer can read. Photos live in the private bucket "fotos". */
const CFG = window.IDEENGLAS_CONFIG || {};
const CFG_OK = !!(CFG.url && CFG.key && !/DEIN-PROJEKT|DEIN-KEY/.test(CFG.url + CFG.key));
const LOGIN = CFG.login === 'code' ? 'code' : 'password';
const sb = (CFG_OK && window.supabase && typeof window.supabase.createClient === 'function')
  ? window.supabase.createClient(CFG.url, CFG.key, {auth: {persistSession: true, autoRefreshToken: true, detectSessionInUrl: false, storageKey: 'ideenglas.auth'}})
  : null;
const BUCKET = 'fotos';
const COLS = ['ideas', 'jars', 'couple', 'profiles'];
const store = {maps: {ideas: new Map(), jars: new Map(), couple: new Map(), profiles: new Map()}, secrets: new Map(), queues: new Map(), channel: null, down: false, lastSync: 0};
function enqueue(key, fn){ const prev = store.queues.get(key) || Promise.resolve(); const next = prev.catch(() => {}).then(fn); store.queues.set(key, next); return next; }
function sbErr(error){ const e = new Error((error && error.message) || 'error'); e.code = (error && (error.code || error.error)) || 'error'; e.status = error && (error.status || error.statusCode); return e; }
async function run(q){ const {data, error} = await q; if (error) throw sbErr(error); return data; }
async function withRetry(fn){ try { return await fn(); } catch (e) { if (!navigator.onLine || (e && /fetch|network/i.test(e.message || ''))) { await sleep(900); return fn(); } throw e; } }
async function guarded(key, fn){ try { return await enqueue(key, () => withRetry(fn)); } catch (e) { onWriteError(e); throw e; } }
function onWriteError(e){
  const st = Number(e && e.status), msg = String((e && e.message) || '');
  if (!navigator.onLine) toast('Keine Internetverbindung. Versuch es gleich nochmal.');
  else if (st === 401 || /JWT|token/i.test(msg)) toast('Deine Anmeldung ist abgelaufen. Schließ die App und öffne sie neu.');
  else if (st === 403 || /row-level security|permission/i.test(msg)) toast('Speichern ist nicht erlaubt. Ist der Datenbank-Schritt vollständig gelaufen?');
  else toast('Speichern hat nicht geklappt. Versuch es nochmal.');
  resync();
}
/* JSON merge patch: objects merge, null removes a key, everything else replaces (same rule as patch_doc in the database) */
function mergePatch(a, b){
  const o = (a && typeof a === 'object' && !Array.isArray(a)) ? {...a} : {};
  for (const k in b) {
    const v = b[k];
    if (v === null || v === undefined) delete o[k];
    else if (typeof v === 'object' && !Array.isArray(v)) o[k] = mergePatch(o[k], v);
    else o[k] = v;
  }
  return o;
}
let afterQueued = false;
function emit(c){
  if (c === 'secrets') { const o = {}; store.secrets.forEach((v, k) => { o[k] = v; }); state.secrets = o; }
  else if (c === 'profiles') { const o = {}; store.maps.profiles.forEach((v, k) => { o[k] = {...v, id: k}; }); state.profiles = o; }
  else if (store.maps[c]) state[c] = [...store.maps[c].entries()].map(([id, v]) => ({...v, id}));
  if (!afterQueued) { afterQueued = true; Promise.resolve().then(() => { afterQueued = false; afterData(); }); }
}
function newId(){
  const a = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789', r = crypto.getRandomValues(new Uint8Array(20));
  let s = ''; r.forEach(x => { s += a[x % 62]; }); return s;
}
const clean = d => JSON.parse(JSON.stringify(d));
async function setDoc(c, id, data){
  const d = clean(data);
  store.maps[c].set(id, d); emit(c);
  return guarded(c + '/' + id, () => run(sb.from('docs').upsert({col: c, id, data: d, updated_at: new Date().toISOString()})));
}
async function addDoc(c, data){ const id = newId(); await setDoc(c, id, data); return id; }
async function updateDoc(c, id, patch){
  const p = clean(patch), cur = store.maps[c].get(id);
  if (cur) { store.maps[c].set(id, mergePatch(cur, p)); emit(c); }
  /* JSON keeps the nulls, and the database needs them to clear fields */
  return guarded(c + '/' + id, () => run(sb.rpc('patch_doc', {p_col: c, p_id: id, p_patch: p})));

async function setSecret(ideaId, data){
  const d = clean(data);
  store.secrets.set(ideaId, d); emit('secrets');
  return guarded('sec/' + ideaId, () => run(sb.from('secrets').upsert({owner: state.me, id: ideaId, data: d})));
}
async function delSecret(ideaId){
  store.secrets.delete(ideaId); emit('secrets');
  return guarded('sec/' + ideaId, () => run(sb.from('secrets').delete().match({owner: state.me, id: ideaId})));

/* loading everything, and staying in sync */
async function fetchAll(){
  const rows = [];
  for (let from = 0; ; from += 1000) {
    const data = await run(sb.from('docs').select('col,id,data').order('col').order('id').range(from, from + 999));
    rows.push(...data); if (data.length < 1000) break;
  }
  const maps = {ideas: new Map(), jars: new Map(), couple: new Map(), profiles: new Map()};
  rows.forEach(r => { if (maps[r.col]) maps[r.col].set(r.id, r.data || {}); });
  const sec = await run(sb.from('secrets').select('id,data').eq('owner', state.me));
  store.maps = maps; store.secrets = new Map(sec.map(r => [r.id, r.data || {}]));
  store.lastSync = Date.now();
  state.loaded = true; state.jarsLoaded = true; state.loadError = false;
  COLS.forEach(emit); emit('secrets');
}
let resyncing = null;
function resync(){
  if (!sb || !state.me) return Promise.resolve();
  if (!resyncing) resyncing = fetchAll().catch(() => {}).finally(() => { resyncing = null; });
  return resyncing;
}
function connect(){
  if (store.channel) { try { sb.removeChannel(store.channel); } catch (e) {} }
  store.channel = sb.channel('ideenglas')
    .on('postgres_changes', {event: '*', schema: 'public', table: 'docs'}, p => {
      const del = p.eventType === 'DELETE', row = del ? p.old : p.new;
      if (!row || !store.maps[row.col]) return;
      if (del) store.maps[row.col].delete(row.id); else store.maps[row.col].set(row.id, row.data || {});
      emit(row.col);
    })
    .on('postgres_changes', {event: '*', schema: 'public', table: 'secrets'}, p => {
      const del = p.eventType === 'DELETE', row = del ? p.old : p.new;
      if (!row || row.owner !== state.me) return;
      if (del) store.secrets.delete(row.id); else store.secrets.set(row.id, row.data || {});
      emit('secrets');
    })
    .subscribe(status => {
      if (status === 'SUBSCRIBED') { if (store.down) resync(); store.down = false; }
      else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED') store.down = true;
    });
}

const photoCache = (() => { try { return JSON.parse(lsGet('ideenglas.photos') || '{}') || {}; } catch (e) { return {}; } })();
const photoWant = new Set(); let photoT = 0;
function photoSrc(id){
  const c = photoCache[id];
  if (c && c.exp > Date.now() + 36e5) return c.url;
  photoWant.add(id); if (!photoT) photoT = setTimeout(signPhotos, 0);
  return c && c.exp > Date.now() ? c.url : BLANK;
}
const imgAttr = id => 'src="' + photoSrc(id) + '" data-pid="' + esc(id) + '"';
async function signPhotos(){
  photoT = 0; const ids = [...photoWant]; photoWant.clear();
  if (!ids.length || !sb) return;
  try {
    const data = await run(sb.storage.from(BUCKET).createSignedUrls(ids, 7 * 86400));
    const exp = Date.now() + 7 * 864e5 - 6e5;
    (data || []).forEach(d => { if (d && d.signedUrl && d.path) photoCache[d.path] = {url: d.signedUrl, exp}; });
    const keys = Object.keys(photoCache);
    if (keys.length > 600) keys.sort((a, b) => photoCache[a].exp - photoCache[b].exp).slice(0, keys.length - 600).forEach(k => delete photoCache[k]);
    lsSet('ideenglas.photos', JSON.stringify(photoCache));
    document.querySelectorAll('img[data-pid]').forEach(img => { const c = photoCache[img.dataset.pid]; if (c && img.getAttribute('src') !== c.url) { img.classList.remove('broken'); img.src = c.url; } });
  } catch (e) {}
}
const assetsStore = {
  async upload(blob){
    const t = blob.type || 'image/jpeg', ext = t === 'image/png' ? 'png' : t === 'image/webp' ? 'webp' : t === 'image/gif' ? 'gif' : 'jpg';
    const id = newId() + '.' + ext;
    const {error} = await sb.storage.from(BUCKET).upload(id, blob, {contentType: t, cacheControl: '31536000', upsert: false});
    if (error) {
      const e = sbErr(error), m = String(error.message || '') + ' ' + String(error.statusCode || error.status || '');
      e.code = /413|too large|size/i.test(m) ? 'too_large' : /mime|type/i.test(m) ? 'unsupported_type' : /403|row-level|policy|unauthorized/i.test(m) ? 'not_allowed' : /bucket/i.test(m) ? 'no_bucket' : 'upstream_error';
      throw e;
    }
    return {id};
  },
  async delete(id){ const {error} = await sb.storage.from(BUCKET).remove([id]); if (error) throw sbErr(error); delete photoCache[id]; return {deleted: true}; }
};
async function deleteAssets(ids){
  if (!state.assets || !ids || !ids.length) return;
  for (const id of ids) { try { await state.assets.delete(id); } catch (e) {} }
}
function loadImg(url){ return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = url; }); }
async function shrink(file){
  const url = URL.createObjectURL(file);
  try {
    const img = await loadImg(url);
    const max = 1600, sc = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const w = Math.max(1, Math.round(img.naturalWidth * sc)), h = Math.max(1, Math.round(img.naturalHeight * sc));
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    c.getContext('2d').drawImage(img, 0, 0, w, h);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.82));
    if (blob && blob.size) return blob;
  } catch (e) {} finally { URL.revokeObjectURL(url); }
  if (/^image\/(jpeg|png|webp|gif)$/.test(file.type)) return file;
  const err = new Error('format'); err.code = 'unsupported_type'; throw err;
}
async function uploadPhoto(file){
  const blob = await shrink(file);
  try { return await state.assets.upload(blob); }
  catch (e) { if (e && e.code === 'upstream_error' && navigator.onLine) { await sleep(800); return state.assets.upload(blob); } throw e; }
}
function photoError(e){
  const c = e && e.code;
  if (!navigator.onLine) return 'Keine Internetverbindung. Die Fotos wurden noch nicht hochgeladen.';
  if (c === 'too_large') return 'Ein Foto ist zu groß.';
  if (c === 'unsupported_type') return 'Dieses Bildformat geht leider nicht. Versuch es mit einem JPG oder PNG.';
  if (c === 'not_allowed') return 'Fotos hochladen ist nicht erlaubt. Ist der Datenbank-Schritt vollständig gelaufen?';
  if (c === 'no_bucket') return 'Der Fotospeicher fehlt noch. Ist der Datenbank-Schritt vollständig gelaufen?';
  return 'Ein Foto ließ sich nicht hochladen. Versuch es nochmal.';
}

/* what the other person did since this viewer last had the app open */
function news(){
  const s = state.since, me = actor();
  if (!s || !me || !state.loaded) return null;
  const other = x => !!x && x !== me;
  return {
    slips: state.ideas.filter(i => !i.surprise && statusOf(i) === 'open' && other(i.by) && (i.createdAt || 0) > s && voteOf(i, me) === null),
    matches: state.ideas.filter(i => statusOf(i) === 'open' && isMatch(i) && (i.matchedAt || 0) > s && other(i.matchedBy)),
    gifts: state.ideas.filter(i => i.surprise && statusOf(i) === 'planned' && (i.createdAt || 0) > s && other(i.by)),
    proposals: state.ideas.filter(i => statusOf(i) === 'proposed' && i.proposal && other(i.proposal.by) && (i.proposal.at || 0) > s),
    declines: state.ideas.filter(i => i.declined && other(i.declined.by) && (i.declined.at || 0) > s && statusOf(i) !== 'proposed'),
    plans: state.ideas.filter(i => !i.surprise && statusOf(i) === 'planned' && (i.plannedAt || 0) > s && other(i.plannedBy)),
    memories: state.ideas.filter(i => statusOf(i) === 'done' && (i.doneAt || i.revealedAt || 0) > s && other(i.doneBy || i.by))
  };
}
function topJarOf(list){ const c = {}; list.forEach(i => { c[jarIdOf(i)] = (c[jarIdOf(i)] || 0) + 1; }); return Object.entries(c).sort((a, b) => b[1] - a[1])[0][0]; }

    if (n.gifts.length) items.push(`<button class="news-item" data-action="news-go" data-t="geplant">${ico('gift', 15)} ${n.gifts.length === 1 ? 'Eine Überraschung für dich' : n.gifts.length + ' Überraschungen für dich'}</button>`);
    if (n.proposals.length) items.push(`<button class="news-item" data-action="news-go" data-t="geplant">${ico('cal', 15)} ${n.proposals.length === 1 ? 'Ein Terminvorschlag' : n.proposals.length + ' Terminvorschläge'} für dich</button>`);

    if (n.plans.length) items.push(`<button class="news-item" data-action="news-go" data-t="geplant">${ico('check', 15, 2.4)} ${n.plans.length === 1 ? 'Ein Termin steht' : n.plans.length + ' Termine stehen'} fest</button>`);

/* "Weißt du noch?": a memory from exactly a month or a year ago, otherwise one older memory per day, photos first */
function rememberPick(){
  const done = state.ideas.filter(i => statusOf(i) === 'done' && i.doneDate);
  if (!done.length) return null;
  const t = parseD(todayStr());
  let best = null;
  done.forEach(i => {
    const d = parseD(i.doneDate), months = (t.getFullYear() - d.getFullYear()) * 12 + (t.getMonth() - d.getMonth());
    if (months >= 1 && d.getDate() === t.getDate() && (!best || months > best.months)) best = {i, months};
  });
  if (best) {
    const y = best.months / 12;
    return {i: best.i, why: best.months % 12 === 0 ? `Heute vor ${y === 1 ? 'einem Jahr' : y + ' Jahren'}` : `Heute vor ${best.months === 1 ? 'einem Monat' : best.months + ' Monaten'}`};
  }
  const old = done.filter(i => dayDiff(parseD(i.doneDate), t) >= 7);
  if (!old.length) return null;
  const withPh = old.filter(i => (i.photos || []).length);
  const pool = (withPh.length ? withPh : old).sort((a, b) => String(a.id).localeCompare(String(b.id)));
  const pick = pool[hash(todayStr()) % pool.length];
  const dd = dayDiff(parseD(pick.doneDate), t), w = Math.round(dd / 7), m = Math.round(dd / 30.4), y = Math.floor(dd / 365);
  const why = dd < 30 ? `Vor ${w === 1 ? 'einer Woche' : w + ' Wochen'}` : dd < 365 ? `Vor ${m <= 1 ? 'einem Monat' : m + ' Monaten'}` : `Vor ${y === 1 ? 'einem Jahr' : y + ' Jahren'}`;
  return {i: pick, why};
}
function rememberHTML(){
  if (lsGet('ideenglas.remember.hide') === todayStr()) return '';
  const r = rememberPick(); if (!r) return '';
  const i = r.i, ph = i.photos || [], act = isSpecial(i) && ph.length ? 'recap' : 'open', id = esc(i.id);
  return `<section class="deep remember" aria-label="Weißt du noch?"><span class="fx" aria-hidden="true"></span><span class="fx" aria-hidden="true"></span><span class="fx" aria-hidden="true"></span>
    <div class="rem-in">
      ${ph.length ? `<button class="rem-ph" data-action="${act}" data-id="${id}" aria-label="${esc(i.title)} ansehen"><img ${imgAttr(ph[0])} alt="" loading="lazy" data-asset="1"></button>` : ''}

      <button class="sheet-x rem-x" data-action="remember-hide" aria-label="Für heute ausblenden">${ico('x', 20, 2.2)}</button>
    </div></section>`;
}

function renderGlas(){
  const v = $('#view-glas');
  if (!state.loaded) { v.innerHTML = headerHTML() + loadingHTML(); return; }
  const jar = curJar(), kind = kindOfJar(jar), me = actor();
  const all = state.ideas, n = {open:0, planned:0, done:0};
  all.forEach(i => { n[statusOf(i)] = (n[statusOf(i)] || 0) + 1; });
  let html = headerHTML() + heroHTML() + nextHTML() + newsHTML() + rememberHTML();
  html += `<div class="stat3"><div class="stat">${n.open ? '<span class="glowdot"></span>' : ''}<b>${n.open}</b><span>im Glas</span></div><div class="stat"><b>${n.planned + (n.proposed || 0)}</b><span>geplant</span></div><div class="stat"><b>${n.done}</b><span>erlebt</span></div></div>`;
  html += jarChipsHTML();
  const open = openIn(jar.id).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  const sugg = suggList(jar.id);
  if (!open.length) {
    const picks = [], seen = new Set();
    sugg.forEach(s => { const c = JSON.stringify(Object.values(s.f)[0]); if (!seen.has(c) && picks.length < 5) { seen.add(c); picks.push(s.idx); } });
    html += `<div class="empty" style="margin-top:18px">
      <h2 class="empty-h">„${esc(jar.name)}“ ist noch leer</h2>
      <p class="empty-p">${esc(kind.empty)}</p>
      ${state.readOnly ? '' : `<button class="btn primary" data-action="add">${ico('plus', 18, 2.6)} Ersten Zettel einwerfen</button>`}
    </div>
    ${!state.readOnly && picks.length ? `<h2 class="sec">Oder nehmt einen Anstoß</h2><div class="sugg-list">${picks.map(suggCard).join('')}</div><div class="more"><button class="btn soft" data-action="suggest">Alle ${sugg.length} Anstöße ansehen</button></div>` : ''}`;
    v.innerHTML = html; return;
  }
  const cf = colorField(kind);
  if (state.glasCat !== 'alle' && !(cf && open.some(i => i[cf.key] === state.glasCat))) state.glasCat = 'alle';
  const inCat = state.glasCat === 'alle' ? open : open.filter(i => i[cf.key] === state.glasCat);
  const matches = inCat.filter(isMatch);
  const fresh = me ? inCat.filter(i => voteOf(i, me) === null && !isMatch(i)) : [];
  let f = state.glasFilter;
  if (f === 'neu' && !me) f = state.glasFilter = 'alle';
  html += `<div class="segrow"><div class="seg" role="group" aria-label="Zettel zeigen">
      <button data-action="filter" data-v="alle" aria-pressed="${f === 'alle'}">Alle</button>
      <button data-action="filter" data-v="match" aria-pressed="${f === 'match'}">Wir beide${matches.length ? ` <span class="n">${matches.length}</span>` : ''}</button>
      ${me ? `<button data-action="filter" data-v="neu" aria-pressed="${f === 'neu'}">Neu${fresh.length ? ` <span class="n">${fresh.length}</span>` : ''}</button>` : ''}
    </div>${cf ? `<button class="iconbtn" data-action="glasfilter" aria-label="Nach ${esc(cf.label)} filtern">${ico('sliders', 20)}</button>` : ''}</div>`;
  if (state.glasCat !== 'alle') {
    const idx = cf.options.findIndex(o => o.v === state.glasCat);
    html += `<div class="catchip"><button class="chip" data-action="glascat" data-v="alle" aria-pressed="true">${ico(cf.options[idx].i, 16)} ${esc(cf.options[idx].l)}<span class="x" aria-label="Filter entfernen">${ico('x', 14, 2.4)}</span></button></div>`;
  }
  if (f === 'alle') {
    const rest = inCat.filter(i => !isMatch(i));
    if (matches.length) html += `<h2 class="sec">Wollen wir beide <span class="pill-fly">${matches.length} ${matches.length === 1 ? 'Match' : 'Matches'}</span></h2><div class="rows">${matches.map(rowHTML).join('')}</div>`;
    if (rest.length) html += `<h2 class="sec">Im Glas <span class="n">${rest.length}</span></h2><div class="rows">${rest.map(rowHTML).join('')}</div>`;
  } else if (f === 'match') {
    html += `<h2 class="sec">Wollen wir beide <span class="pill-fly">${matches.length} ${matches.length === 1 ? 'Match' : 'Matches'}</span></h2>`;
    html += matches.length ? `<div class="rows">${matches.map(rowHTML).join('')}</div>` : `<p class="empty-p" style="margin:0">Noch keine Matches. Sobald ihr beide bei einem Zettel ein Herz setzt, leuchtet er hier auf.</p>`;
  } else {
    html += `<h2 class="sec">Neu für dich <span class="n">${fresh.length}</span></h2>`;
    html += fresh.length ? `<div class="rows">${fresh.map(rowHTML).join('')}</div>` : `<p class="empty-p" style="margin:0">Du hast über alles abgestimmt.</p>`;
  }
  if (!state.readOnly && sugg.length) html += `<div class="more"><button class="btn soft" data-action="suggest">Ideen-Anstöße ansehen</button></div>`;
  v.innerHTML = html;
}

  return `<div class="card lit${depth ? ' d' + depth : ''}" ${top ? 'id="card-top" tabindex="0" role="group" aria-roledescription="Karte" aria-label="' + esc(i.title) + '. Nach rechts wischen für Will ich, nach links für Eher nicht."' : 'aria-hidden="true"'} data-id="${esc(i.id)}">

function drawFields(){ return kindOfJar(curJar()).fields.filter(f => !f.color); }
function candidates(){
  const jar = curJar();
  return openIn(jar.id).filter(i => {
    for (const f of drawFields()) {
      const v = state.drawF[f.key];
      if (v == null || v === 'alle') continue;
      if (f.upto) { if ((Number(i[f.key]) || 0) > Number(v)) return false; }
      else if (String(i[f.key]) !== String(v)) return false;
    }
    return !state.drawMatch || isMatch(i);
  });
}
function drawChipLabels(){
  const out = [];
  drawFields().forEach(f => {
    const v = state.drawF[f.key];
    if (v == null || v === 'alle') return;
    out.push(f.upto ? (Number(v) === 0 ? 'gratis' : 'bis ' + optLabel(f, v)) : optLabel(f, v));
  });
  if (state.drawMatch) out.push('Wir beide');
  return out.length ? out : ['Alle Zettel'];
}
function renderEinigen(){

function bindSwipe(card){
  if (!card) return;
  let sx = 0, sy = 0, dx = 0, dy = 0, drag = false, pid = null;
  card.addEventListener('pointerdown', e => {
    if (e.button !== undefined && e.button !== 0) return;
    drag = true; pid = e.pointerId; sx = e.clientX; sy = e.clientY; dx = dy = 0;
    card.style.transition = 'none';
    try { card.setPointerCapture(pid); } catch (err) {}
  });
  card.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== pid) return;
    dx = e.clientX - sx; dy = e.clientY - sy;
    card.style.transform = `translate(${dx}px, ${dy * 0.25}px) rotate(${dx / 16}deg)`;
    card.dataset.dir = dx > 40 ? 'yes' : dx < -40 ? 'no' : '';
  });
  const end = () => {
    if (!drag) return; drag = false;
    card.style.transition = '';
    if (Math.abs(dx) > 90) fling(card, dx > 0);
    else { card.style.transform = ''; card.dataset.dir = ''; }
  };
  card.addEventListener('pointerup', end);
  card.addEventListener('pointercancel', end);
}
function fling(card, yes){
  const id = card.dataset.id;
  if (state.pending.has(id)) return;
  state.pending.add(id);
  card.dataset.dir = yes ? 'yes' : 'no';
  card.style.pointerEvents = 'none';
  card.style.transition = 'transform .22s ease-in, opacity .22s ease-in';
  card.style.transform = `translate(${yes ? 140 : -140}%, 20px) rotate(${yes ? 20 : -20}deg)`;
  card.style.opacity = '0';
  setTimeout(() => castVote(id, yes), reduceMotion() ? 0 : 210);
}
async function castVote(id, yes){
  const i = find(id), me = actor();
  if (!i || !me) { state.pending.delete(id); render(); return; }
  const othersYes = likers(i).some(x => x !== me);
  state.lastVote = {id, prev: voteOf(i, me)};
  const patch = {likes: {[me]: yes}};
  if (yes && othersYes) { patch.matchedAt = Date.now(); patch.matchedBy = me; }
  try { await updateDoc('ideas', id, patch); }
  catch (e) { state.lastVote = null; }
  state.pending.delete(id);
  if (yes && othersYes) { state.matchNote = id; notifyPush('match', id); }
  render();
  const top = $('#card-top'); if (top) top.focus({preventScroll:true});
}
function voteTop(yes){ const top = $('#card-top'); if (top) fling(top, yes); }
function laterTop(){
  const top = $('#card-top'); if (!top) return;
  const id = top.dataset.id;
  if (state.pending.has(id)) return;
  if (freshFor(curJar().id, actor()).length <= 1) { toast('Das ist gerade der einzige offene Zettel.'); return; }
  top.style.pointerEvents = 'none';
  top.classList.add('later-out');
  setTimeout(() => {
    state.skips[id] = Date.now(); saveSkips(); render();
    const t = $('#card-top'); if (t) t.focus({preventScroll:true});
  }, reduceMotion() ? 0 : 220);
}
async function undo(){
  const lv = state.lastVote; if (!lv) return;
  state.lastVote = null;
  if (state.matchNote === lv.id) state.matchNote = null;
  try { await updateDoc('ideas', lv.id, {likes: {[actor()]: lv.prev}}); toast('Stimme zurückgenommen.'); } catch (e) {}
  render();
}
async function draw(){
  let c = candidates(); if (!c.length) return;
  if (c.length > 1 && state.drawn) c = c.filter(i => i.id !== state.drawn);
  const pick = c[Math.floor(Math.random() * c.length)];
  if (!reduceMotion()) { state.drawn = null; state.shake = true; render(); await sleep(560); state.shake = false; }
  state.drawn = pick.id; state.drawAnim = !reduceMotion(); render();
  const card = $('#drawn');
  if (card) { card.focus({preventScroll:true}); card.scrollIntoView({block:'center', behavior: reduceMotion() ? 'auto' : 'smooth'}); }
}

/* one equal tile per day you saved: its own number, what it counts, and when it comes round next */
function dayTiles(){
  const D = days(), t = parseD(todayStr()), tiles = [];
  const plural = (n, one, many) => n === 1 ? one : many;
  const sinceTile = (dateStr, icon, k, what) => {
    const o = parseD(dateStr), n = dayDiff(o, t);
    if (n < 0) return {icon, k, n: -n, u: plural(-n, 'Tag bis dahin', 'Tage bis dahin'), s: 'am ' + F_LONG.format(o)};
    const r = nextYearly(dateStr, t), d = dayDiff(t, r.date);
    const next = r.n > 0 ? (d === 0 ? `Heute: ${yearsLabel(r.n, what)}!` : `${r.n}. Jahrestag ${d === 1 ? 'morgen' : 'in ' + d + ' Tagen'}`) : '';
    return {icon, k, n, u: plural(n, 'Tag her', 'Tage her'), s: F_LONG.format(o) + (next ? ' · ' + next : ''), today: r.n > 0 && d === 0};
  };
  if (D.together) {
    const tt = togetherText();
    tiles.push({icon: 'heart', k: 'Zusammen', n: Math.abs(tt.total), u: tt.total < 0 ? plural(-tt.total, 'Tag bis zum Start', 'Tage bis zum Start') : plural(tt.total, 'Tag zusammen', 'Tage zusammen'), s: tt.sub, today: specialDays(0).some(u => /zusammen|Jahrestag/.test(u.label))});
  }
  if (D.met) tiles.push(sinceTile(D.met, 'sparkle', 'Kennengelernt', 'seit dem Kennenlernen'));
  if (D.first) tiles.push(sinceTile(D.first, 'glow', 'Erstes Date', 'seit dem ersten Date'));
  (D.custom || []).filter(c => c && c.date).map(c => {
    const icon = /geburt/i.test(c.label || '') ? 'gift' : 'cal';
    if (c.yearly === false) {
      const o = parseD(c.date), n = dayDiff(t, o);
      return n >= 0
        ? {icon, k: c.label || 'Besonderer Tag', n, u: n === 0 ? 'Heute!' : plural(n, 'Tag bis dahin', 'Tage bis dahin'), s: F_LONG.format(o), today: n === 0, sort: n}
        : {icon, k: c.label || 'Besonderer Tag', n: -n, u: plural(-n, 'Tag her', 'Tage her'), s: F_LONG.format(o), sort: 9999};
    }
    const r = nextYearly(c.date, t), d = dayDiff(t, r.date);
    return {icon, k: c.label || 'Besonderer Tag', n: d, u: d === 0 ? 'Heute!' : plural(d, 'Tag bis dahin', 'Tage bis dahin'), s: F_SHORT.format(r.date) + ' · jedes Jahr', today: d === 0, sort: d};
  }).sort((a, b) => a.sort - b.sort).forEach(x => tiles.push(x));
  return tiles;
}

function collageCells(n){
  if (n === 1) return ['solo'];
  if (n === 2) return ['big', 'tall'];
  const out = ['big', '', ''], cycle = [['', '', ''], ['wide', ''], ['bigr', '', ''], ['', 'wide']];
  let k = 3, step = 0;
  while (k < n) {
    let u = cycle[step % cycle.length];
    if (u.length > n - k) u = n - k === 1 ? ['full'] : ['wide', ''];
    u.forEach(c => out.push(c)); k += u.length; step++;
  }
  return out;
}

/* ---------- trips: plan with stations and map, packing list, to-dos, links ---------- */
/* Everything for a trip lives inside its idea under "trip", keyed by id, so both phones can add and tick things at once:
   trip.stops {id: {t, day, time, place, lat, lon, done, ph {photoId: at}, notes {person: {t, r}}, song, at, by}},
   trip.pack / trip.todo {id: {t, d, w, at, by}}, trip.links {id: {t, u, at, by}}, trip.geo {lat, lon, label}. */
const MAX_STOP_PHOTOS = 10;
const DAY_COLORS = ['#7B3F9E', '#2F5DB8', '#2F7D4F', '#C2571F', '#B32D6C', '#0E7C86', '#8A6410'];
const LOOSE_COLOR = '#7A7394';
const isTrip = i => !!i && jarIdOf(i) === 'reisen' && !i.surprise;
const tripOf = i => (i && i.trip) || {};
const listOf = o => Object.entries(o || {}).filter(([, v]) => v && typeof v === 'object').map(([id, v]) => ({...v, id}));
const stopsOf = i => listOf(tripOf(i).stops);
const stopById = (i, sid) => { const s = (tripOf(i).stops || {})[sid]; return s && typeof s === 'object' ? {...s, id: sid} : null; };
const stopPhotos = s => Object.entries((s && s.ph) || {}).filter(([, v]) => v != null).sort((a, b) => (Number(a[1]) || 0) - (Number(b[1]) || 0)).map(([id]) => id);
const allStopPhotos = i => stopsOf(i).sort((a, b) => String(a.day || '9').localeCompare(String(b.day || '9')) || (a.at || 0) - (b.at || 0)).flatMap(stopPhotos);
const tripPhotoCount = i => (i.photos || []).length + (isTrip(i) ? stopsOf(i).reduce((n, s) => n + stopPhotos(s).length, 0) : 0);
const hasCoords = s => !!s && typeof s.lat === 'number' && typeof s.lon === 'number';
function tripRange(i){
  const done = statusOf(i) === 'done';
  const a = done ? i.doneDate : i.planDate;
  if (!a) return null;
  let b = done ? (i.doneEnd || (i.planEnd && i.planEnd > a ? i.planEnd : '')) : (i.planEnd || '');
  if (!b || b < a) b = a;
  return {a, b};
}
function datesBetween(a, b, max = 31){
  const out = [], d = parseD(a), e = parseD(b);
  while (d <= e && out.length < max) { out.push(ymd(d)); d.setDate(d.getDate() + 1); }
  return out;
}
function tripDays(i){
  const r = tripRange(i), set = new Set(r ? datesBetween(r.a, r.b) : []);
  stopsOf(i).forEach(s => { if (s.day) set.add(s.day); });
  return [...set].sort();
}
/* order inside a day: by time; a stop without time stays right after the stop that was added before it */
function dayStops(list){
  let last = '00:00';
  return [...list].sort((x, y) => (x.at || 0) - (y.at || 0))
    .map(s => { if (s.time) last = s.time; return {s, k: s.time || last, timed: !!s.time}; })
    .sort((x, y) => x.k.localeCompare(y.k) || (x.timed === y.timed ? (x.s.at || 0) - (y.s.at || 0) : (x.timed ? -1 : 1)))
    .map(x => x.s);
}
function tripPlan(i){
  const days = tripDays(i), stops = stopsOf(i);
  const groups = days.map((d, k) => ({day: d, k, color: DAY_COLORS[k % DAY_COLORS.length], stops: dayStops(stops.filter(s => s.day === d))}));
  return {groups, loose: dayStops(stops.filter(s => !s.day || !days.includes(s.day)))};
}
function tripWhen(i){
  const r = tripRange(i), t = todayStr(), st = statusOf(i);
  if (st === 'done') return 'Erlebt';
  if (!r) return st === 'proposed' ? 'Termin in Absprache' : 'Noch ohne Zeitraum';
  if (t < r.a) return cap(rel(r.a)) + ' geht’s los';
  if (t <= r.b) { const n = dayDiff(parseD(r.a), parseD(r.b)) + 1, k = dayDiff(parseD(r.a), parseD(t)) + 1; return n > 1 ? `Tag ${k} von ${n}` : 'Heute'; }
  return 'Vorbei';
}
const dayLabel = (g) => `Tag ${g.k + 1}`;
async function patchTrip(id, p){ return updateDoc('ideas', id, {trip: p}); }
function avgHearts(s){
  const rs = Object.values((s && s.notes) || {}).map(x => Number(x && x.r) || 0).filter(Boolean);
  return rs.length ? Math.round(rs.reduce((a, b) => a + b, 0) / rs.length * 10) / 10 : 0;
}

  let m = s.match(/open\.spotify\.com\/(?:intl-[a-z]{2}(?:-[a-zA-Z]{2})?\/)?(?:embed\/)?(playlist|track|album|episode|show|artist)\/([A-Za-z0-9]{10,40})/);
  if (!m) m = s.match(/^spotify:(playlist|track|album|episode|show|artist):([A-Za-z0-9]{10,40})$/);
  return m ? {type: m[1], id: m[2], url: `https://open.spotify.com/${m[1]}/${m[2]}`} : null;
}
const spotifyEmbed = (sp, h) => `<iframe class="spot" title="Spotify" src="https://open.spotify.com/embed/${sp.type}/${sp.id}?utm_source=generator&amp;theme=0" height="${h}" loading="lazy" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe>`;

/* places: search and reverse lookup with OpenStreetMap data (Photon, Nominatim as fallback) */
async function fetchJSON(url, ms = 9000){
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), ms);
  try { const r = await fetch(url, {signal: ctl.signal}); if (!r.ok) throw new Error('http ' + r.status); return await r.json(); }
  finally { clearTimeout(t); }
}
function uniqParts(parts, name){ const seen = new Set([String(name || '').toLowerCase()]); return parts.filter(p => { const k = String(p || '').toLowerCase(); if (!k || seen.has(k)) return false; seen.add(k); return true; }); }
function photonItem(f){
  const p = (f && f.properties) || {}, c = f && f.geometry && f.geometry.coordinates;
  if (!c || c.length < 2) return null;
  const street = p.street ? p.street + (p.housenumber ? ' ' + p.housenumber : '') : '';
  const name = p.name || street || p.city || p.county || p.state || p.country || '';
  if (!name) return null;
  return {name, sub: uniqParts([street, p.district || p.locality, p.city || p.county, p.country], name).join(', '), lat: Number(c[1]), lon: Number(c[0])};
}
async function geoSearch(q, near){
  const u = new URL('https://photon.komoot.io/api/');
  u.searchParams.set('q', q); u.searchParams.set('lang', 'de'); u.searchParams.set('limit', '7');
  if (near && typeof near.lat === 'number') { u.searchParams.set('lat', near.lat.toFixed(4)); u.searchParams.set('lon', near.lon.toFixed(4)); }
  try {
    const r = await fetchJSON(u.toString());
    const seen = new Set();
    return (r.features || []).map(photonItem).filter(x => x && !seen.has(x.name + '|' + x.sub) && seen.add(x.name + '|' + x.sub));
  } catch (e) {
    const n = new URL('https://nominatim.openstreetmap.org/search');
    n.searchParams.set('format', 'jsonv2'); n.searchParams.set('q', q); n.searchParams.set('limit', '7'); n.searchParams.set('accept-language', 'de');
    const r = await fetchJSON(n.toString());
    return (r || []).map(x => { const parts = String(x.display_name || '').split(', '); const name = x.name || parts[0] || ''; return name ? {name, sub: uniqParts(parts.slice(1, 4), name).join(', '), lat: Number(x.lat), lon: Number(x.lon)} : null; }).filter(Boolean);
  }
}
async function geoReverse(lat, lon){
  try {
    const r = await fetchJSON(`https://photon.komoot.io/reverse?lat=${lat.toFixed(6)}&lon=${lon.toFixed(6)}&lang=de`, 7000);
    const it = (r.features || []).map(photonItem).find(Boolean);
    return it ? it.name : '';
  } catch (e) { return ''; }
}

/* the map: Leaflet from the CDN, tiles from CARTO with OpenStreetMap data */
const LEAFLET = 'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/';
let leafletP = null;
function loadLeaflet(){
  if (window.L && window.L.map) return Promise.resolve(window.L);
  if (!document.getElementById('leaflet-css')) { const l = document.createElement('link'); l.id = 'leaflet-css'; l.rel = 'stylesheet'; l.href = LEAFLET + 'leaflet.css'; document.head.appendChild(l); }
  if (!leafletP) leafletP = new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = LEAFLET + 'leaflet.js'; s.async = true;
    s.onload = () => (window.L && window.L.map ? res(window.L) : rej(new Error('leaflet')));
    s.onerror = () => { leafletP = null; s.remove(); rej(new Error('leaflet')); };
    document.head.appendChild(s);

const darkUI = () => { const th = document.documentElement.getAttribute('data-theme'); return th ? th === 'dark' : !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches); };
function baseTiles(L){

    attribution: '© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> · © <a href="https://carto.com/attributions" target="_blank" rel="noopener">CARTO</a>'});

const pinIcon = (L, n, color, done, faded) => L.divIcon({className: 'stop-pin' + (done ? ' done' : '') + (faded ? ' faded' : ''), html: `<span style="--c:${color}">${esc(String(n))}</span>`, iconSize: [30, 30], iconAnchor: [15, 15]});
const flyIcon = L => L.divIcon({className: 'fly-pin', html: '<span></span>', iconSize: [20, 20], iconAnchor: [10, 10]});
const meIcon = L => L.divIcon({className: 'me-pin', html: '<span></span>', iconSize: [18, 18], iconAnchor: [9, 9]});
function bindLongPress(map, cb){
  const el = map.getContainer(); let t = 0, sx = 0, sy = 0, fired = 0;
  const clear = () => { clearTimeout(t); t = 0; };
  el.addEventListener('touchstart', e => {
    clear(); if (e.touches.length !== 1) return;
    sx = e.touches[0].clientX; sy = e.touches[0].clientY;
    t = setTimeout(() => { t = 0; fired = Date.now(); const r = el.getBoundingClientRect(); cb(map.containerPointToLatLng([sx - r.left, sy - r.top])); }, 550);
  }, {passive: true});
  el.addEventListener('touchmove', e => { const p = e.touches[0]; if (!p || e.touches.length > 1 || Math.hypot(p.clientX - sx, p.clientY - sy) > 10) clear(); }, {passive: true});
  el.addEventListener('touchend', e => { clear(); if (Date.now() - fired < 700 && e.cancelable) e.preventDefault(); }, {passive: false});
  el.addEventListener('touchcancel', clear, {passive: true});

/* markers for one trip, numbered per day like the list */
function drawStops(L, layer, i, only, onPick){
  const plan = tripPlan(i), pts = [];
  plan.groups.forEach(g => {
    if (only && only !== 'alle' && only !== g.day) return;
    const line = [];
    g.stops.forEach((s, k) => {
      if (!hasCoords(s)) return;
      line.push([s.lat, s.lon]); pts.push([s.lat, s.lon]);
      const m = L.marker([s.lat, s.lon], {icon: pinIcon(L, k + 1, g.color, s.done), title: s.t || '', riseOnHover: true, interactive: !!onPick, keyboard: !!onPick});
      if (onPick) m.on('click', () => onPick(s.id));
      m.addTo(layer);
    });
    if (line.length > 1) L.polyline(line, {color: g.color, weight: 3, opacity: .55, dashArray: '6 8', interactive: false}).addTo(layer);
  });
  if (!only || only === 'alle' || only === 'ohne') plan.loose.forEach(s => {
    if (!hasCoords(s)) return;
    pts.push([s.lat, s.lon]);
    const m = L.marker([s.lat, s.lon], {icon: pinIcon(L, '', LOOSE_COLOR, s.done, true), title: s.t || '', riseOnHover: true, interactive: !!onPick, keyboard: !!onPick});
    if (onPick) m.on('click', () => onPick(s.id));
    m.addTo(layer);
  });
  const g = tripOf(i).geo;
  if (!pts.length && g && typeof g.lat === 'number') L.marker([g.lat, g.lon], {icon: flyIcon(L), title: g.label || '', interactive: false}).addTo(layer);
  return pts;
}

  if (pts.length > 1) map.fitBounds(pts, {padding: [40, 40], maxZoom: 16});
  else if (pts.length === 1) map.setView(pts[0], 15);
  else if (geo && typeof geo.lat === 'number') map.setView([geo.lat, geo.lon], 12);
  else map.setView([48.37, 10.9], 5);
}

const THEMES = [
  {v: 'sonne', l: 'Nach Sonnenstand', s: 'Hell ab Sonnenaufgang, dunkel ab Sonnenuntergang'},
  {v: 'system', l: 'Wie iPhone', s: 'Folgt der Einstellung „Hell“ oder „Dunkel“ am iPhone'},

/* sunrise and sunset for a day and place (the usual astronomical formulas, good to about a minute) */
function sunTimes(date, lat, lon){
  const rad = Math.PI / 180, DAYMS = 864e5, J1970 = 2440588, J2000 = 2451545, e = rad * 23.4397, J0 = 0.0009;
  const noon = new Date(date.getFullYear(), date.getMonth(), date.getDate(), 12);
  const d = noon.valueOf() / DAYMS - 0.5 + J1970 - J2000, lw = rad * -lon, phi = rad * lat;
  const n = Math.round(d - J0 - lw / (2 * Math.PI));
  const transit = (ht) => J0 + (ht + lw) / (2 * Math.PI) + n;
  const ds = transit(0), M = rad * (357.5291 + 0.98560028 * ds);
  const L = M + rad * (1.9148 * Math.sin(M) + 0.02 * Math.sin(2 * M) + 0.0003 * Math.sin(3 * M)) + rad * 102.9372 + Math.PI;
  const dec = Math.asin(Math.sin(e) * Math.sin(L));
  const jt = (a) => J2000 + a + 0.0053 * Math.sin(M) - 0.0069 * Math.sin(2 * L);
  const w = Math.acos((Math.sin(rad * -0.833) - Math.sin(phi) * Math.sin(dec)) / (Math.cos(phi) * Math.cos(dec)));
  if (!isFinite(w)) return null;
  const jnoon = jt(ds), jset = jt(transit(w)), jrise = jnoon - (jset - jnoon);
  const toDate = j => new Date((j + 0.5 - J1970) * DAYMS);
  return {rise: toDate(jrise), set: toDate(jset)};
}

}
const hm = d => pad(d.getHours()) + ':' + pad(d.getMinutes());
function sunLine(){
  const pl = themePlace(), st = sunTimes(new Date(), pl.lat, pl.lon);

}
let themeT = 0;
function applyTheme(){
  clearTimeout(themeT); themeT = 0;
  const pref = themePref(), root = document.documentElement;
  let mode = null;
  if (pref === 'tag') mode = 'light';
  else if (pref === 'nacht') mode = 'dark';
  else if (pref === 'sonne') {
    const now = new Date(), pl = themePlace(), st = sunTimes(now, pl.lat, pl.lon);
    if (st) {
      mode = now >= st.rise && now < st.set ? 'light' : 'dark';
      const tomorrow = sunTimes(new Date(now.getTime() + 864e5), pl.lat, pl.lon);
      const next = now < st.rise ? st.rise : now < st.set ? st.set : (tomorrow && tomorrow.rise);
      if (next) themeT = setTimeout(applyTheme, Math.min(Math.max(next - now + 2000, 20000), 3 * 36e5));
    }
  }
  const before = root.getAttribute('data-theme');
  if (mode) root.setAttribute('data-theme', mode); else root.removeAttribute('data-theme');
  const dark = mode ? mode === 'dark' : !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  document.querySelectorAll('meta[name="theme-color"]').forEach(m => { if (!m.dataset.orig) m.dataset.orig = m.content; m.content = mode ? (dark ? '#271F50' : '#F8F5FE') : m.dataset.orig; });
  if (before !== root.getAttribute('data-theme')) {
    if (tmap.map) { destroyTripMap(); ensureTripMap(); }
    if (state.recap) { const r = $('#recap'); if (r) r.dataset.sig = ''; renderRecap(); }
  }
}

async function squarePhoto(file, size = 480){
  const url = URL.createObjectURL(file);
  try {
    const img = await loadImg(url), s = Math.min(img.naturalWidth, img.naturalHeight);
    const c = document.createElement('canvas'); c.width = c.height = Math.min(size, s);
    c.getContext('2d').drawImage(img, (img.naturalWidth - s) / 2, (img.naturalHeight - s) / 2, s, s, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.86));
    if (!blob || !blob.size) throw new Error('format');
    return blob;
  } finally { URL.revokeObjectURL(url); }
}
async function pickProfilePhoto(input){
  const f = input.files && input.files[0]; input.value = '';

const REVEAL_DAYS = 7;
const MEM_SINCE = Date.parse('2026-10-15T00:00:00+02:00');
/* all notes of an experience; an old shared text counts as its author's note */
function memList(i){
  const out = Object.entries((i && i.mem) || {}).filter(([, v]) => v && typeof v === 'object' && (v.t || v.r))
    .map(([uid, v]) => ({uid, t: String(v.t || ''), r: Number(v.r) || 0, at: v.at || 0}));
  const lu = i && (i.doneBy || i.by);
  if (i && (i.memory || Number(i.rating)) && lu && !out.some(n => n.uid === lu)) out.unshift({uid: lu, t: String(i.memory || ''), r: Number(i.rating) || 0, at: 0, legacy: true});
  return out;
}
const memOpenAt = i => (i.doneAt || 0) + REVEAL_DAYS * 864e5;
const memBoth = i => new Set(memList(i).map(n => n.uid)).size >= 2;
function memRevealed(i){
  const n = memList(i);
  if (n.some(x => x.legacy) || memBoth(i)) return true;
  return !i.doneAt || i.doneAt < MEM_SINCE || Date.now() >= memOpenAt(i);
}
const memMine = i => { const me = actor(); return me ? memList(i).find(n => n.uid === me) || null : null; };
const memVisible = i => { const me = actor(); return memRevealed(i) ? memList(i) : memList(i).filter(n => n.uid === me); };
function memAvg(i, all){
  const rs = (all ? memList(i) : memVisible(i)).map(n => n.r).filter(Boolean);
  return rs.length ? rs.reduce((a, b) => a + b, 0) / rs.length : 0;
}
const memRating = i => Math.round(memAvg(i));
const memFirstText = i => (memVisible(i).find(n => n.t) || {}).t || '';
const memQuotesHTML = (i, cls = 'memo-quote') => memVisible(i).filter(n => n.t).map(n => `<span class="${cls}">„${esc(n.t)}“ <b>${esc(personNom(n.uid))}</b></span>`).join('');
const memWaitText = i => `Sieht ${esc(partnerName('der andere'))}, sobald ihr beide geschrieben habt, spätestens am ${F_DM.format(new Date(memOpenAt(i)))}.`;
/* under an album card: write your own, or a quiet note that yours is still private */
function memCTA(i, inSheet){
  if (state.readOnly || !actor()) return '';
  const mine = memMine(i), id = esc(i.id);
  if (!mine) {
    const fresh = !memList(i).some(n => n.legacy) && (i.doneAt || 0) > Date.now() - 45 * 864e5;
    if (!inSheet && !fresh) return '';
    return `<button class="mem-cta" data-action="done" data-id="${id}">${ico('heart', 15, 2.2)} Deine Erinnerung ${memRevealed(i) && memList(i).length ? 'dazuschreiben' : 'schreiben'}</button>`;
  }
  if (!memRevealed(i)) return `<p class="mem-wait">${ico('lock', 13, 2.2)} <span>Deine Erinnerung. ${memWaitText(i)}</span></p>`;
  return '';
}
/* the notes inside the idea sheet */
function memSheetHTML(i){
  const notes = memVisible(i), r = memRating(i);
  return `${r ? heartsHTML(r) : ''}${notes.filter(n => n.t || n.r).map(n => `<div class="mem-note"><span class="mem-who">${avatar(n.uid, 22)} ${esc(personNom(n.uid))}${n.r ? `<span class="mem-r">${heartsHTML(n.r)}</span>` : ''}</span>${n.t ? `<p class="sheet-note">„${esc(n.t)}“</p>` : ''}</div>`).join('')}${memCTA(i, true)}`;
}
/* the data to save from the "Wie war's?" sheet for the person writing */
function memPatch(i, rating, text){
  const me = actor(); if (!me) return {rating, memory: text};
  const prev = memMine(i);
  const out = {mem: {[me]: (rating || text) ? {t: text, r: rating, at: (prev && prev.at) || Date.now()} : null}};
  if (prev && prev.legacy) { out.memory = null; out.rating = null; }
  return out;
}
function memHelp(i){
  const fresh = statusOf(i) !== 'done' || (state.sheet && state.sheet.fresh);
  const other = esc(partnerName('der andere'));
  return `<p class="help">${!fresh && memRevealed(i) ? `${other} sieht deine Erinnerung sofort.` : `${other} sieht deine Erinnerung und deine Herzen erst, wenn ihr beide geschrieben habt, spätestens nach ${REVEAL_DAYS} Tagen.`}</p>`;
}

/* ---------- Monatsrückblick: on the 1st, last month as story slides, with the song of the month ---------- */
const mkOf = d => d.getFullYear() + '-' + pad(d.getMonth() + 1);
const curMk = () => mkOf(new Date());
const shiftMk = (mk, n) => { const d = parseD(mk + '-01'); d.setMonth(d.getMonth() + n); return mkOf(d); };
const prevMk = (mk = curMk()) => shiftMk(mk, -1);
const F_MONLY = new Intl.DateTimeFormat('de-DE', {month: 'long'});
const mkName = mk => F_MONLY.format(parseD(mk + '-01'));
const mkYear = mk => mk.slice(0, 4);
const inMk = (s, mk) => !!s && String(s).slice(0, 7) === mk;
const msMk = ms => ms ? mkOf(new Date(ms)) : '';
const songsDoc = () => state.couple.find(d => d.id === 'songs') || null;
const monthDoc = mk => ((songsDoc() || {})[mk]) || {};
const songDue = mk => Date.now() >= parseD(shiftMk(mk, 1) + '-08').getTime();
async function songPatch(mk, patch){
  if (songsDoc()) return updateDoc('couple', 'songs', {[mk]: patch});
  return setDoc('couple', 'songs', {[mk]: patch});
}

function monthData(mk){
  const done = state.ideas.filter(i => statusOf(i) === 'done' && inMk(i.doneDate, mk)).sort((a, b) => String(a.doneDate).localeCompare(String(b.doneDate)));
  const photos = [];
  done.forEach(i => {
    (i.photos || []).forEach((p, k) => photos.push({p, act: `data-action="photo" data-id="${esc(i.id)}" data-v="${k}"`}));
    if (isTrip(i)) stopsOf(i).forEach(s => stopPhotos(s).forEach((p, k) => photos.push({p, act: `data-action="stop-photo" data-trip="${esc(i.id)}" data-v="${esc(s.id)}" data-k="${k}"`})));
  });
  const places = [], seen = new Set();
  const addP = s => { const n = String(s || '').split(',')[0].trim(), key = n.toLowerCase(); if (n && !seen.has(key)) { seen.add(key); places.push(n); } };
  done.forEach(i => { if (isTrip(i)) { const g = tripOf(i).geo; if (g && g.label) addP(g.label); stopsOf(i).forEach(s => addP(s.place || s.t)); } else addP(i.place); });
  const quotes = [];
  done.forEach(i => {
    if (memRevealed(i)) memList(i).filter(n => n.t).forEach(n => quotes.push({t: n.t, uid: n.uid, about: i.title}));
    if (isTrip(i)) stopsOf(i).forEach(s => Object.entries(s.notes || {}).forEach(([uid, x]) => { if (x && x.t) quotes.push({t: x.t, uid, about: s.t || s.place || i.title}); }));
  });
  const ranked = done.map(i => ({i, a: memRevealed(i) ? memAvg(i, true) : 0, n: tripPhotoCount(i)})).sort((x, y) => y.a - x.a || y.n - x.n);
  return {
    mk, done, photos, places, quotes, fav: ranked.length ? ranked[0] : null,
    slips: state.ideas.filter(i => !i.surprise && msMk(i.createdAt) === mk).length,
    matches: state.ideas.filter(i => msMk(i.matchedAt) === mk).length
  };
}
const coverOf = i => (i.photos || [])[0] || (isTrip(i) ? allStopPhotos(i)[0] : null) || null;

/* ---------- song of the month: proposals during the month, a secret vote on the 1st ---------- */
function monthSongs(mk){
  const out = [], ids = new Set();
  Object.entries(monthDoc(mk).songs || {}).forEach(([sid, s]) => {
    const sp = s && spotifyParse(s.u);
    if (sp && !ids.has(sp.id)) { ids.add(sp.id); out.push({sid, sp, t: s.t || '', by: s.by || null, at: s.at || 0}); }
  });
  state.ideas.filter(isTrip).forEach(i => stopsOf(i).forEach(st => {
    const sp = spotifyParse(st.song);
    if (sp && inMk(st.day || i.doneDate || i.planDate, mk) && !ids.has(sp.id)) { ids.add(sp.id); out.push({sid: 'st-' + sp.id, sp, t: '', by: st.by || null, at: st.at || 0, from: st.t || st.place || i.title}); }
  }));
  return out.sort((a, b) => (a.at - b.at) || a.sid.localeCompare(b.sid));
}
function songResult(mk){
  const cands = monthSongs(mk), votes = monthDoc(mk).votes || {};
  const byId = sid => cands.find(c => c.sid === sid);
  if (!cands.length) return {state: 'none', cands};
  if (cands.length === 1) return {state: 'done', song: cands[0], how: 'one', cands};
  const valid = Object.entries(votes).filter(([, sid]) => byId(sid));
  const picks = [...new Set(valid.map(v => v[1]))].sort();
  if (valid.length >= 2) {
    if (picks.length === 1) return {state: 'done', song: byId(picks[0]), how: 'same', cands};
    return {state: 'done', song: byId(picks[hash(mk + '|' + picks.join('|')) % picks.length]), how: 'glas', picks, cands};
  }
  if (songDue(mk)) {
    if (valid.length === 1) return {state: 'done', song: byId(valid[0][1]), how: 'one-vote', cands};
    return {state: 'done', song: cands[hash(mk) % cands.length], how: 'glas', cands};
  }
  return {state: 'vote', cands, mine: votes[actor()] || null};
}
async function songTitle(sp){
  try { const r = await fetchJSON('https://open.spotify.com/oembed?url=' + encodeURIComponent(sp.url), 5000); return r && r.title ? String(r.title).slice(0, 80) : ''; } catch (e) { return ''; }
}
async function addSong(mk, url, title){
  const sp = spotifyParse(url);
  if (!sp || sp.type !== 'track') return false;
  if (monthSongs(mk).some(c => c.sp.id === sp.id)) { toast('Dieses Lied ist schon vorgeschlagen.'); return true; }
  const t = title || await songTitle(sp);
  await songPatch(mk, {songs: {[newId()]: {u: sp.url, t, by: actor() || null, at: Date.now()}}});
  return true;
}
function songSheet(){

/* ---------- the story ---------- */

    <button class="btn ghost" data-action="month-close">Schließen</button></div>`});
  return slides;
}
function songSlideHTML(mk, r){

    const l = $('label[for="done-date"]'); if (l) l.textContent = t.checked ? 'Von' : 'Wann war das?';
    if (pd && !t.checked) {
      const over = pd.keep.length + pd.add.length - MAX_PHOTOS;
      if (over > 0) toast(`Ohne „Besonderes Erlebnis“ gehen nur ${MAX_PHOTOS} Fotos. Nimm ${over} raus oder lass es angehakt.`);
    }
    renderPhotoDraft();
  }
  else if (t.id === 'ph-input') {
    const pd = state.photoDraft; if (!pd) return;
    const max = pd.max || photoLimit(pd.special), room = max - pd.keep.length - pd.add.length;
    const files = [...(t.files || [])].filter(f => /^image\//.test(f.type) || /\.(heic|heif|jpe?g|png|webp|gif)$/i.test(f.name));
    files.slice(0, Math.max(0, room)).forEach(f => pd.add.push({tmp: 't' + Math.random().toString(36).slice(2, 9), file: f, url: URL.createObjectURL(f)}));
    if (files.length > room) toast(pd.max ? `Pro Station gehen bis zu ${max} Fotos.` : pd.special ? `Bei besonderen Erlebnissen gehen bis zu ${max} Fotos.` : `Pro Erlebnis gehen bis zu ${max} Fotos. Mehr geht bei besonderen Erlebnissen.`);
    t.value = '';
    renderPhotoDraft();
  }
  else if (t.type === 'date' && t.id) {
    const er = $('#' + t.id + '-err'); if (er) er.hidden = true;
    if (/^p-d/.test(t.id) && $('#p-err')) $('#p-err').hidden = true;
    const chips = t.closest('form') && t.closest('form').querySelectorAll(`[data-action="quick-date"][data-t="${t.id}"]`);
    if (chips) chips.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === t.value)));
  }
});
document.addEventListener('input', e => {

  else if (f.id === 'f-login') submitLogin(f); else if (f.id === 'f-code') submitCode(f); else if (f.id === 'f-profile') submitProfile(f); else if (f.id === 'f-pw') submitPassword(f); else if (f.id === 'f-sur') submitSurprise(f); else if (f.id === 'f-days') submitDays(f);

document.addEventListener('error', e => { const t = e.target; if (t && t.tagName === 'IMG' && t.dataset && t.dataset.asset) t.classList.add('broken'); }, true);
document.addEventListener('keydown', e => {
  if (state.gate) return;
  if (e.key === 'Enter' && e.target && e.target.id === 'st-place') { e.preventDefault(); stopGeoSearch(); return; }
  if (state.lightbox) {
    if (e.key === 'Escape') { e.preventDefault(); closeLightbox(); }
    else if (e.key === 'ArrowRight') { state.lightbox.k++; renderLightbox(); }
    else if (e.key === 'ArrowLeft') { state.lightbox.k--; renderLightbox(); }
    return;
  }
  if (state.recap) {
    if (e.key === 'Escape') { e.preventDefault(); closeRecap(); }
    else if (e.key === 'Tab') {
      const f = [...$('#recap').querySelectorAll('button, a[href]')].filter(x => x.offsetParent !== null);
      if (f.length) { const first = f[0], last = f[f.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); } }
    }
    return;
  }
  if (!state.sheet && state.trip) {
    if (e.key === 'Escape') { e.preventDefault(); if (state.mapPick) finishPick(null); else if ($('#mapwrap.full')) setMapFull(false); else closeTrip(); }
    return;
  }
  if (!state.sheet) {
    const tag = (e.target && e.target.tagName) || '';
    if (currentTab() === 'einigen' && !/INPUT|TEXTAREA|SELECT/.test(tag)) {
      if (e.key === 'ArrowRight') { e.preventDefault(); voteTop(true); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); voteTop(false); }
      else if (e.key === 'ArrowDown' && $('#card-top')) { e.preventDefault(); laterTop(); }
    }
    return;
  }
  if (e.key === 'Escape') { closeSheet(); render(); return; }
  if (e.key !== 'Tab') return;
  const f = [...$('#sheet').querySelectorAll('button:not([disabled]), input:not([type=radio]):not([disabled]), input[type=radio]:checked, textarea, a[href]')].filter(x => x.offsetParent !== null);
  if (!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
});
$('#lightbox').addEventListener('click', e => { if (e.target.id === 'lightbox') closeLightbox(); });
window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });
document.addEventListener('visibilitychange', () => {

let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 3000); }

function afterData(){
  if (state.drawn) { const d = find(state.drawn); if (!d || statusOf(d) !== 'open') state.drawn = null; }
  if (state.matchNote) { const d = find(state.matchNote); if (!d || statusOf(d) !== 'open') state.matchNote = null; }
  if (state.lastVote && !find(state.lastVote.id)) state.lastVote = null;
  if (state.loaded && state.jarsLoaded && !allJars().some(j => j.id === state.jar)) setJar('aktivitaeten');
  const s = state.sheet;
  if (s && s.id && !find(s.id) && !['settings', 'days', 'surprise'].includes(s.type)) closeSheet();
  render();
  if (state.sheet && ['idea', 'suggest', 'drawfilter', 'glasfilter', 'settings'].includes(state.sheet.type)) renderSheet();
  if (state.recap) renderRecap();
  if (state.lightbox) renderLightbox();
  if (state.trip) renderTrip();
  restoreTrip();
  applyTheme();
  if (state.places) renderPlaces();
  maybeMonth();
  refreshProfiles();
}

/* ---------- sign-in, first-time profile, connection problems ---------- */
const isStandalone = () => !!(navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches));
const isIOS = () => /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
function showGate(kind, opts){
  state.gate = {kind, ...(opts || {})};
  document.body.classList.add('gated');
  if (state.sheet) closeSheet();
  renderGate(true);
}
function hideGate(){
  state.gate = null; document.body.classList.remove('gated');
  const g = $('#gate'); g.hidden = true; g.innerHTML = '';
}
function gateFig(){
  return `<div class="gate-fig"><span class="fx" aria-hidden="true"></span><span class="fx" aria-hidden="true"></span><span class="fx" aria-hidden="true"></span>${jarSVG(6, 'Waschbär im Glas')}</div>`;
}
function homeTip(){
  if (isStandalone() || !isIOS()) return '';
  return `<div class="gate-tip">${ico('sparkle', 16, 2.2)}<span><b>Tipp vor dem Anmelden:</b> Tippe in Safari unten auf <b>Teilen</b> und dann auf <b>„Zum Home-Bildschirm“</b>. Öffne das Glas danach über das neue Symbol und melde dich dort an. So startet es wie eine App.</span></div>`;
}
function profileFields(p){
  const hasPh = !!(p && p.photo) || !!state.profilePic;
  const choice = state.profilePic || (p && p.photo) ? 2 : (p && p.figure) ? 1 : 0;
  const fig = choice === 1, name = (p && p.name) || '';
  const prev = state.profilePic ? `<img src="${state.profilePic.url}" alt="">` : p && p.photo ? `<img ${imgAttr(p.photo)} alt="" data-asset="1">` : ico('camera', 24, 2);
  const letter = (firstName(name) || '?').charAt(0).toUpperCase();
  return `<div class="field"><label class="lbl" for="p-name">Wie heißt du?</label><input id="p-name" type="text" maxlength="30" autocomplete="given-name" placeholder="Dein Vorname" value="${esc(name)}"><p class="err" id="p-name-err" hidden>Schreib kurz deinen Namen hin.</p></div>
    <fieldset class="field"><legend class="lbl">Dein Bild in der App</legend>
      <div class="av-pick">
        <label class="av-opt" for="p-fig-0"><input type="radio" name="p-fig" id="p-fig-0" value="0" ${choice === 0 ? 'checked' : ''}><span class="av" id="p-letter">${esc(letter)}</span><span>Buchstabe</span></label>
        <label class="av-opt" for="p-fig-1"><input type="radio" name="p-fig" id="p-fig-1" value="1" ${fig ? 'checked' : ''}><span class="av">${figureSVG()}</span><span>Figur</span></label>
        <label class="av-opt" for="p-fig-2"><input type="radio" name="p-fig" id="p-fig-2" value="2" ${choice === 2 ? 'checked' : ''}><span class="av av-ph" id="p-photo-prev">${prev}</span><span>Eigenes Foto</span></label>
      </div>
      <div class="photo-row"><label class="btn soft small" id="p-photo-btn" for="p-photo">${ico('camera', 16, 2.2)} <span>${hasPh ? 'Anderes Foto wählen' : 'Foto wählen'}</span><input type="file" id="p-photo" accept="image/*" class="sr"></label><span class="help">Wird quadratisch aus der Mitte zugeschnitten.</span></div>
      <p class="err" id="p-photo-err" hidden>Wähl zuerst ein Foto aus.</p></fieldset>`;
}
function renderGate(initial){
  const g = state.gate, box = $('#gate'); if (!g) return;
  let inner = '';
  if (g.kind === 'config') {
    inner = `<h1 class="gate-h">Fast geschafft</h1><p class="gate-p">In der Datei <b>config.js</b> fehlen noch die Adresse und der Schlüssel eures Supabase-Projekts. Trag beides dort ein und lade die Seite neu.</p>`;
  } else if (g.kind === 'offline') {
    inner = `<h1 class="gate-h">Keine Verbindung</h1><p class="gate-p">${esc(g.msg || 'Das Glas lässt sich gerade nicht öffnen. Prüf das Internet und versuch es nochmal.')}</p><button class="btn primary" data-action="gate-retry">Nochmal versuchen</button>`;
  } else if (g.kind === 'login' && LOGIN === 'password') {
    inner = `<form id="f-login" class="form" novalidate>
      <div><h1 class="gate-h" id="gate-h" tabindex="-1">Unser Ideenglas</h1><p class="gate-p">Melde dich an. Danach bleibst du auf diesem Handy angemeldet.</p></div>
      <div class="field"><label class="lbl" for="l-mail">E-Mail</label><input id="l-mail" type="email" autocomplete="username" inputmode="email" autocapitalize="off" spellcheck="false" value="${esc(g.email || '')}"></div>
      <div class="field"><label class="lbl" for="l-pass">Passwort</label><input id="l-pass" type="password" autocomplete="current-password"></div>
      <p class="err" id="l-err" role="alert" hidden></p>
      <button class="btn primary" type="submit">Anmelden</button>
    </form>${homeTip()}`;
  } else if (g.kind === 'login') {
    inner = `<form id="f-login" class="form" novalidate>
      <div><h1 class="gate-h" id="gate-h" tabindex="-1">Unser Ideenglas</h1><p class="gate-p">Gib deine E-Mail-Adresse ein. Du bekommst einen Code, mit dem du dich anmeldest. Danach bleibst du auf diesem Handy angemeldet.</p></div>
      <div class="field"><label class="lbl" for="l-mail">E-Mail</label><input id="l-mail" type="email" autocomplete="email" inputmode="email" autocapitalize="off" spellcheck="false" value="${esc(g.email || '')}"></div>
      <p class="err" id="l-err" role="alert" hidden></p>
      <button class="btn primary" type="submit">Code schicken</button>
    </form>${homeTip()}`;
  } else if (g.kind === 'code') {
    inner = `<form id="f-code" class="form" novalidate>
      <div><h1 class="gate-h" id="gate-h" tabindex="-1">Schau in dein Postfach</h1><p class="gate-p">Wir haben einen Code an <b>${esc(g.email)}</b> geschickt. Gib ihn hier ein.</p></div>
      <div class="field"><label class="lbl" for="l-code">Code</label><input id="l-code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="10" pattern="[0-9]*" class="code-in"></div>
      <p class="err" id="l-err" role="alert" hidden></p>
      <button class="btn primary" type="submit">Anmelden</button>
      <button class="link-btn" type="button" data-action="gate-back">Andere E-Mail-Adresse</button>
    </form>`;
  } else if (g.kind === 'profile') {
    inner = `<form id="f-profile" class="form" novalidate>
      <div><h1 class="gate-h" id="gate-h" tabindex="-1">Schön, dass du da bist</h1><p class="gate-p">Noch zwei Kleinigkeiten, dann geht’s los.</p></div>
      ${profileFields(state.profiles[state.me])}
      <button class="btn primary" type="submit">Los geht’s</button>
    </form>`;
  }
  box.innerHTML = `<div class="gate-in">${gateFig()}${inner}</div>`;
  box.hidden = false;
  if (initial) { window.scrollTo(0, 0); const f = box.querySelector('input:not([type=radio])') || box.querySelector('.btn'); if (f && !isIOS()) f.focus({preventScroll:true}); }
}
function loginError(e){
  const m = String((e && (e.message || e.code)) || '');
  if (!navigator.onLine || /fetch|network/i.test(m)) return 'Keine Internetverbindung. Versuch es gleich nochmal.';
  if (/invalid login|invalid_credentials|Invalid login credentials/i.test(m)) return 'E-Mail oder Passwort stimmt nicht.';
  if (/not confirmed/i.test(m)) return 'Diese E-Mail ist in Supabase noch nicht bestätigt.';
  if (/signups not allowed|not found|user not found/i.test(m)) return 'Für diese E-Mail gibt es noch kein Konto.';
  if (/not authorized/i.test(m)) return 'Supabase darf an diese Adresse noch keine Mails schicken.';
  if (/rate limit|too many|security purposes/i.test(m)) return 'Gerade wurden zu viele Codes verschickt. Warte etwas und versuch es dann nochmal.';
  if (/expired|invalid.*otp|token/i.test(m)) return 'Der Code stimmt nicht oder ist abgelaufen. Lass dir einen neuen schicken.';
  return 'Das hat nicht geklappt. Versuch es nochmal.';
}
function gateErr(msg){ const el = $('#l-err'); if (el) { el.textContent = msg; el.hidden = false; } }
async function submitLogin(form){
  const email = $('#l-mail').value.trim().toLowerCase();
  if (!/^\S+@\S+\.\S+$/.test(email)) { gateErr('Gib deine E-Mail-Adresse ein.'); $('#l-mail').focus(); return; }
  const btn = form.querySelector('[type=submit]'); btn.disabled = true; $('#l-err').hidden = true;
  try {
    if (LOGIN === 'password') {
      const pass = $('#l-pass').value;
      if (!pass) { gateErr('Gib dein Passwort ein.'); $('#l-pass').focus(); btn.disabled = false; return; }
      const {data, error} = await sb.auth.signInWithPassword({email, password: pass});
      if (error) throw error;
      await start(data.user);
    } else {
      const {error} = await sb.auth.signInWithOtp({email, options: {shouldCreateUser: false}});
      if (error) throw error;
      showGate('code', {email});
    }
  } catch (e) { gateErr(loginError(e)); btn.disabled = false; }
}
async function submitCode(form){
  const token = $('#l-code').value.replace(/\D/g, '');
  if (token.length < 6) { gateErr('Gib den Code aus der E-Mail ein.'); $('#l-code').focus(); return; }
  const btn = form.querySelector('[type=submit]'); btn.disabled = true;
  try {
    const {data, error} = await sb.auth.verifyOtp({email: state.gate.email, token, type: 'email'});
    if (error) throw error;
    await start(data.user);
  } catch (e) { gateErr(loginError(e)); btn.disabled = false; }
}
function readProfileForm(){
  const name = $('#p-name').value.trim();
  if (!name) { $('#p-name-err').hidden = false; $('#p-name').focus(); return null; }
  const c = $('#p-fig-2') && $('#p-fig-2').checked ? 2 : $('#p-fig-1').checked ? 1 : 0;
  if (c === 2 && !state.profilePic && !(state.profiles[state.me] || {}).photo) { $('#p-photo-err').hidden = false; return null; }
  return {name, figure: c === 1, usePhoto: c === 2};
}
async function submitProfile(form){
  const p = readProfileForm(); if (!p) return;
  const btn = form.querySelector('[type=submit]'); btn.disabled = true;
  const old = (state.profiles[state.me] || {}).photo || null; let photo = old, drop = null;
  try {
    if (p.usePhoto && state.profilePic && state.assets) { const label = btn.textContent; btn.textContent = 'Foto wird hochgeladen …'; try { photo = (await state.assets.upload(state.profilePic.blob)).id; } catch (e) { btn.textContent = label; throw e; } if (old) drop = old; }
    else if (!p.usePhoto) { if (old) drop = old; photo = null; }
  } catch (e) { toast(photoError(e)); btn.disabled = false; return; }
  const usePhoto = p.usePhoto; delete p.usePhoto;
  try {
    await setDoc('profiles', state.me, {...(state.profiles[state.me] || {}), ...p, photo: usePhoto ? photo : null, id: undefined});
    if (drop && drop !== photo) deleteAssets([drop]);
    if (state.profilePic) { try { URL.revokeObjectURL(state.profilePic.url); } catch (e) {} state.profilePic = null; }
    if (state.gate) { hideGate(); render(); toast(`Hallo ${firstName(p.name)}!`); }
    else { toast('Gespeichert.'); openSheet('settings'); }
  } catch (e) { btn.disabled = false; }
}

/* ---------- start ---------- */
async function start(user){
  state.me = user.id; state.email = user.email || ''; state.mode = 'db'; state.assets = assetsStore; state.readOnly = false;
  hideGate(); loadViewerPrefs(); render();
  try { await fetchAll(); }
  catch (e) {
    const st = Number(e && e.status);
    if (st === 401) { try { await sb.auth.signOut(); } catch (x) {} showGate('login'); return; }
    showGate('offline', {msg: /relation|does not exist|schema cache|PGRST2/i.test(String(e && e.message)) ? 'Die Datenbank ist noch nicht eingerichtet. Führe zuerst den Datenbank-Schritt in Supabase aus.' : ''});
    return;
  }
  connect();
  const p = state.profiles[state.me];
  if (!p || !p.name) showGate('profile');
  render();
}
async function init(){
  applyAccent(); applyTheme();
  if (!CFG_OK) { showGate('config'); return; }
  if (!sb) { showGate('offline', {msg: 'Ein Baustein der App ließ sich nicht laden. Prüf das Internet und versuch es nochmal.'}); return; }
  render();
  sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT' && state.me) location.reload(); });
  let session = null;
  try { const {data} = await sb.auth.getSession(); session = data && data.session; } catch (e) {}
  if (!session) { showGate('login'); return; }
  await start(session.user);
}
async function signOut(){
  try { await sb.auth.signOut(); } catch (e) {}
  location.reload();
}
async function submitPassword(form){
  const a = $('#pw-new').value, b = $('#pw-new2').value, err = $('#pw-err');
  if (a.length < 8) { err.textContent = 'Das Passwort braucht mindestens 8 Zeichen.'; err.hidden = false; $('#pw-new').focus(); return; }
  if (a !== b) { err.textContent = 'Die beiden Passwörter sind nicht gleich.'; err.hidden = false; $('#pw-new2').focus(); return; }
  const btn = form.querySelector('[type=submit]'); btn.disabled = true;
  try {
    const {error} = await sb.auth.updateUser({password: a});
    if (error) throw error;
    toast('Neues Passwort gespeichert.'); openSheet('settings');
  } catch (e) {
    err.textContent = /different|same/i.test(String(e.message)) ? 'Das ist schon dein aktuelles Passwort.' : /weak|short/i.test(String(e.message)) ? 'Das Passwort ist zu schwach. Nimm ein längeres.' : 'Das hat nicht geklappt. Versuch es nochmal.';
    err.hidden = false; btn.disabled = false;
  }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') applyTheme();
  if (document.visibilityState === 'visible' && state.me && Date.now() - store.lastSync > 15000) resync();
});
window.addEventListener('online', () => { if (state.me) resync(); render(); });
window.addEventListener('offline', () => render());
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
init();
})();
